        const calculateTechnicalIndicators = (data) => {
            if (!Array.isArray(data) || data.length === 0) return [];
            const closes=data.map(d=>Number(d.close)||0), highs=data.map(d=>Number(d.high)||0), lows=data.map(d=>Number(d.low)||0), volumes=data.map(d=>Number(d.volume)||0);

            const sma=(period,values)=>values.map((_,i)=>average(values.slice(Math.max(0,i-period+1),i+1)));
            const calcEMA=(period,values)=>{if(!values.length)return[];const k=2/(period+1),ema=new Array(values.length).fill(values[0]||0),n=Math.min(period,values.length);ema[n-1]=average(values.slice(0,n));for(let i=n;i<values.length;i++)ema[i]=values[i]*k+ema[i-1]*(1-k);for(let i=n-2;i>=0;i--)ema[i]=values[i];return ema;};
            const ema9=calcEMA(9,closes),ema12=calcEMA(12,closes),ema21=calcEMA(21,closes),ema26=calcEMA(26,closes),ema50=calcEMA(50,closes);

            if(closes.length>14){let gains=0,losses=0;for(let i=1;i<=14;i++){const d=closes[i]-closes[i-1];if(d>0)gains+=d;else losses-=d;}let avgGain=gains/14,avgLoss=losses/14;const r=()=>avgLoss===0?(avgGain===0?50:100):100-100/(1+avgGain/avgLoss);rsi[14]=r();for(let i=15;i<closes.length;i++){const d=closes[i]-closes[i-1];avgGain=(avgGain*13+(d>0?d:0))/14;avgLoss=(avgLoss*13+(d<0?-d:0))/14;rsi[i]=r();}}
            const tr=closes.map((_,i)=>{const pc=i?closes[i-1]:closes[i];return Math.max(highs[i]-lows[i],Math.abs(highs[i]-pc),Math.abs(lows[i]-pc));});
            const atr=sma(14,tr),sma20=sma(20,closes),sma50=sma(50,closes),volSma=sma(20,volumes);
            const bands=closes.map((_,i)=>{const w=closes.slice(Math.max(0,i-19),i+1),m=average(w),sd=Math.sqrt(average(w.map(v=>(v-m)**2)));return{middle:m,upper:m+2*sd,lower:m-2*sd};});
            return data.map((d,i)=>({...d,ema9:+ema9[i].toFixed(3),ema21:+ema21[i].toFixed(3),ema50:+ema50[i].toFixed(3),sma20:+sma20[i].toFixed(3),sma50:+sma50[i].toFixed(3),bbMiddle:+bands[i].middle.toFixed(3),bbUpper:+bands[i].upper.toFixed(3),bbLower:+bands[i].lower.toFixed(3),atr:+(atr[i]||0).toFixed(3),volumeSma20:Math.round(volSma[i]||0),macd:+(macdLine[i]||0).toFixed(3),signal:+(signalLine[i]||0).toFixed(3),hist:+((macdLine[i]||0)-(signalLine[i]||0)).toFixed(3),rsi:+rsi[i].toFixed(2),trend:ema21[i]>=ema50[i]?'BULLISH':'BEARISH'}));
        };

        const generateForcedFakeData = (ticker, timeframe) => {

            let currentPrice = 10 + (Math.random() * 8);

        const scanCandlestickPatterns = (data) => {
            if (!Array.isArray(data) || data.length < 4) return [];

            const segments = [];
            const trendLookback = 3;
            const atrLookback = 14;
            const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
            const trueRange = (candle, previous) => {
                if (!candle) return 0;
                return Math.max(
                    Number(candle.high) - Number(candle.low),
                    Math.abs(Number(candle.high) - Number(previous?.close ?? candle.close)),
                    Math.abs(Number(candle.low) - Number(previous?.close ?? candle.close))
                );
            };
            const atrAt = index => {
                const end = Math.max(0, index - 1);
                const start = Math.max(0, end - atrLookback + 1);
                const ranges = [];
                for (let j = start; j <= end; j++) ranges.push(trueRange(data[j], data[j - 1]));
                return average(ranges) || 0.01;
            };

            // IMPORTANT: trend is calculated only from candles BEFORE the pattern candle.
            // This prevents the reversal candle itself from creating the trend it is
            // supposed to reverse.
            const trendAt = index => {
                const end = index - 1;
                const start = end - trendLookback + 1;
                if (start < 0 || end < 0) return 'SIDEWAYS';
                const change = Number(data[end].close) - Number(data[start].close);
                const priorAtr = atrAt(index);
                const threshold = priorAtr * 0.35;
                if (change > threshold) return 'UP';
                if (change < -threshold) return 'DOWN';
                return 'SIDEWAYS';
            };

            const averageVolumeAt = index => {
                const end = index - 1;
                const start = Math.max(0, end - atrLookback + 1);
                return average(data.slice(start, end + 1).map(candle => Number(candle.volume) || 0));
            };

            const addPattern = (startIndex, endIndex, type, label, context) => {
                const volumeAverage = averageVolumeAt(endIndex);
                const currentVolume = Number(data[endIndex]?.volume) || 0;
                const volumeRatio = volumeAverage > 0 && currentVolume > 0 ? currentVolume / volumeAverage : null;
                segments.push({
                    startIndex,
                    endIndex,
                    type,
                    label,
                    confidence: volumeRatio != null && volumeRatio >= 1.1 ? 'VOLUME_SUPPORT' : 'WATCH',
                    context: {
                        priorTrend: context.priorTrend,
                        atr: context.atr,
                        bodyPct: context.bodyPct,
                        upperShadowPct: context.upperShadowPct,
                        lowerShadowPct: context.lowerShadowPct,
                        volumeRatio
                    }
                });
            };

            for (let i = trendLookback; i < data.length; i++) {
                const curr = data[i];
                const prev = data[i - 1];
                const currOpen = Number(curr.open);
                const currClose = Number(curr.close);
                const currHigh = Number(curr.high);
                const currLow = Number(curr.low);
                const prevOpen = Number(prev.open);
                const prevClose = Number(prev.close);

                if (![currOpen, currClose, currHigh, currLow, prevOpen, prevClose].every(Number.isFinite)) continue;

                const currBody = Math.abs(currClose - currOpen);
                const currRange = Math.max(currHigh - currLow, 0.000001);
                const prevBody = Math.abs(prevClose - prevOpen);
                const isCurrGreen = currClose > currOpen;
                const isPrevGreen = prevClose > prevOpen;
                const trend = trendAt(i);
                const atr = atrAt(i);

                const lowerWick = Math.max(0, Math.min(currOpen, currClose) - currLow);
                const upperWick = Math.max(0, currHigh - Math.max(currOpen, currClose));
                const bodyPct = currBody / currRange;
                const upperShadowPct = upperWick / currRange;
                const lowerShadowPct = lowerWick / currRange;
                const body = Math.max(currBody, 0.000001);

                const context = {
                    priorTrend: trend,
                    atr,
                    bodyPct,
                    upperShadowPct,
                    lowerShadowPct
                };

                // Hammer: a small real body near the top of the range, with a
                // lower shadow at least twice the body, little upper shadow,
                // and a genuine preceding downtrend.
                if (
                    trend === 'DOWN' &&
                    lowerWick >= body * 2 &&
                    upperWick <= body * 0.35 &&
                    bodyPct <= 0.35
                ) {
                    addPattern(i, i, 'BULLISH', 'HAMMER', context);
                    continue;
                }

                // Shooting star: mirror image of a hammer after a genuine
                // preceding uptrend.
                if (
                    trend === 'UP' &&
                    upperWick >= body * 2 &&
                    lowerWick <= body * 0.35 &&
                    bodyPct <= 0.35
                ) {
                    addPattern(i, i, 'BEARISH', 'SHOOTING STAR', context);
                    continue;
                }

                // Engulfing patterns compare real bodies, not the full candle
                // range. The current body must completely contain the prior body.
                if (prevBody > 0) {
                    const bullishEngulfing =
                        trend === 'DOWN' &&
                        !isPrevGreen &&
                        isCurrGreen &&
                        currOpen <= prevClose &&
                        currClose >= prevOpen &&
                        currBody >= prevBody;

                    const bearishEngulfing =
                        trend === 'UP' &&
                        isPrevGreen &&
                        !isCurrGreen &&
                        currOpen >= prevClose &&
                        currClose <= prevOpen &&
                        currBody >= prevBody;

                    if (bullishEngulfing) {
                        addPattern(i - 1, i, 'BULLISH', 'BULLISH ENGULFING', context);
                        continue;
                    }

                    if (bearishEngulfing) {
                        addPattern(i - 1, i, 'BEARISH', 'BEARISH ENGULFING', context);
                        continue;
                    }
                }

                // Near-Marubozu: very small upper and lower shadows, a large
                // body, and a body that is meaningful relative to prior ATR.
                const minimalBody = currBody >= atr * 0.6;
                if (
                    bodyPct >= 0.90 &&
                    upperShadowPct <= 0.05 &&
                    lowerShadowPct <= 0.05 &&
                    minimalBody
                ) {
                    addPattern(
                        i,
                        i,
                        isCurrGreen ? 'BULLISH' : 'BEARISH',
                        isCurrGreen ? 'BULLISH MARUBOZU' : 'BEARISH MARUBOZU',
                        context
                    );
                }
            }

            return segments;
        };

                                                    <span class={`text-[8px] px-1 border rounded-sm ${theme === 'dark' ? 'bg-zinc-900 border-zinc-800 text-zinc-600' : 'bg-zinc-100 border-zinc-300 text-zinc-500'}`}>{dictRef ? dictRef.exchange : 'NAS'}</span>
                                                </div>
                                                <div class={`text-[10px] font-mono ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>V: {details.volume}</div>
                                            </div>
                                            <div class="flex items-center space-x-3 font-mono text-right">
                                                <div>
                                                    <div class={`text-xs font-bold ${theme === 'dark' ? 'text-zinc-200' : 'text-zinc-800'}`}>${details.price.toFixed(2)}</div>
                                                    <div class={`text-[9px] font-bold flex items-center justify-end ${isUp ? 'text-[#00FF66]' : 'text-red-500'}`}>
                                                        {isUp ? '+' : ''}{details.change.toFixed(2)}%
                                                    </div>
                                                </div>
                                                <button onClick={(e) => { e.stopPropagation(); setWatchlist(watchlist.filter(w => w !== ticker)); }} class={`${theme === 'dark' ? 'text-zinc-700' : 'text-zinc-400'} hover:text-red-500`}><Icons.Trash /></button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </aside>

                        <main class={`lg:col-span-6 flex flex-col overflow-hidden transition-all duration-300 ${isMaximized ? `fixed inset-0 z-50 p-6 ${theme === 'dark' ? 'bg-[#050505]' : 'bg-[#f0f2f5]'}` : `${theme === 'dark' ? 'border-zinc-900 bg-zinc-950/20' : 'border-zinc-200 bg-white'}`}`}>
                            <div class={`px-6 py-3 border-b flex flex-wrap items-center justify-between gap-y-2 relative z-10 ${theme === 'dark' ? 'border-zinc-900 bg-zinc-950/40' : 'border-zinc-200 bg-zinc-50'}`}>
                                <div class="flex items-center space-x-4">
                                    <span class={`text-[10px] font-mono font-bold tracking-wider ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>TIMEFRAME</span>
                                    <div class={`flex p-0.5 rounded-sm border ${theme === 'dark' ? 'bg-zinc-950 border-zinc-900' : 'bg-zinc-100 border-zinc-200'}`}>
                                        {['1D', '1W', '1M', '1Y'].map(t => (
                                            <button key={t} onClick={() => setTimeframe(t)} class={`px-2 py-1 text-[9px] font-mono font-bold transition-all rounded-xs cursor-pointer ${timeframe === t ? 'bg-[#00FF66] text-black' : `${theme === 'dark' ? 'text-zinc-600 hover:text-zinc-400' : 'text-zinc-500 hover:text-zinc-700'}`}`}>{t}</button>
                                        ))}
                                    </div>
                                </div>
                                
                                <div class="flex items-center space-x-4">
                                    <button 
                                        onClick={() => setShowPatterns(!showPatterns)} 
                                        class={`px-3 py-1 text-[9px] font-mono font-bold border rounded-xs transition-all flex items-center space-x-1.5 cursor-pointer ${showPatterns ? 'bg-emerald-900/20 border-[#00FF66] text-[#00FF66]' : theme === 'dark' ? 'bg-zinc-900/40 border-zinc-800 text-zinc-500' : 'bg-zinc-100 border-zinc-300 text-zinc-500'}`}
                                    >
                                        <Icons.Eye />
                                        <span>CANDLESTICK PATTERNS: {showPatterns ? 'ON' : 'OFF'}</span>
                                    </button>

                                    <button onClick={() => setShowPatternLab(!showPatternLab)} class={`px-3 py-1 text-[9px] font-mono font-bold border rounded-xs cursor-pointer ${showPatternLab ? 'border-blue-500 text-blue-400' : theme === 'dark' ? 'border-zinc-800 text-zinc-500' : 'border-zinc-300 text-zinc-500'}`}>PATTERN LAB</button>

                                    <button onClick={() => setIsMaximized(!isMaximized)} class={`${theme === 'dark' ? 'text-zinc-600 hover:text-zinc-400' : 'text-zinc-400 hover:text-zinc-600'} cursor-pointer`}>
                                        {isMaximized ? <Icons.Minimize /> : <Icons.Maximize />}
                                    </button>
                                </div>
                            </div>

                            <div class="flex-1 p-6 flex flex-col justify-between overflow-hidden relative z-10">
                                <div class={`flex items-center justify-between border-b pb-4 ${theme === 'dark' ? 'border-zinc-900' : 'border-zinc-200'}`}>
                                    <h2 class={`text-xl font-bold font-mono tracking-wider ${theme === 'dark' ? 'text-white' : 'text-zinc-900'}`}>
                                        {activeStock}
                                        <span class={`text-xs font-normal ml-2 ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>// {activeCompanyMeta.name}</span>
                                    </h2>
                                    <div class="text-xl font-bold font-mono text-[#00FF66] bg-[#00FF66]/5 border border-[#00FF66]/20 px-3 py-1 rounded-sm">
                                        ${stockPrices[activeStock] ? stockPrices[activeStock].price.toFixed(2) : '0.00'}
                                    </div>
                                </div>

                                <div class="flex-1 w-full relative pt-4 overflow-hidden">
                                    <CandlestickChart vectorData={renderedChartData} theme={theme} showPatterns={showPatterns} />
                                </div>
                            </div>
                            {showPatternLab && <PatternLab data={renderedChartData} theme={theme} />}
                        </main>

                        <aside class={`lg:col-span-3 flex flex-col overflow-y-auto divide-y ${theme === 'dark' ? 'bg-[#070708] divide-zinc-900' : 'bg-zinc-50 divide-zinc-200'}`}>
                            <div class="p-6 space-y-4">
                                <h3 class={`text-[10px] font-mono font-bold tracking-widest uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>QUANTITATIVE DATA MATRIX</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    {[
                                        { label: 'MARKET CAP', value: stockPrices[activeStock] ? stockPrices[activeStock].cap : activeCompanyMeta.cap },
                                        { label: 'P/E RATIO', value: stockPrices[activeStock] ? stockPrices[activeStock].pe : activeCompanyMeta.pe },
                                        { label: `WINDOW LOW (${timeframe})`, value: windowLow ? `$${windowLow.toFixed(2)}` : 'N/A' },
                                        { label: `WINDOW HIGH (${timeframe})`, value: windowHigh ? `$${windowHigh.toFixed(2)}` : 'N/A' }
                                    ].map((m, idx) => (
                                        <div key={idx} class={`border rounded-sm p-3 font-mono ${theme === 'dark' ? 'bg-[#0b0b0c] border-zinc-900' : 'bg-white border-zinc-200'}`}>
                                            <div class={`text-[8px] tracking-widest uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>{m.label}</div>
                                            <div class={`text-xs font-bold mt-1 ${theme === 'dark' ? 'text-zinc-300' : 'text-zinc-700'}`}>{m.value}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div class={`p-6 space-y-3 border-b ${theme === 'dark' ? 'border-zinc-900' : 'border-zinc-200'}`}>
                                <div class="flex items-center justify-between"><h3 class={`text-[10px] font-mono font-bold tracking-widest ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>PRICE ALERTS</h3><button onClick={() => setPriceAlerts([...priceAlerts,{id:Date.now(),ticker:activeStock,target:Number((stockPrices[activeStock]?.price||0).toFixed(2)),direction:'ABOVE'}])} class="text-[9px] font-mono text-[#00FF66]">+ ADD</button></div>
                                {priceAlerts.filter(a=>a.ticker===activeStock).map(a=><div key={a.id} class={`flex justify-between text-[10px] font-mono p-2 ${theme === 'dark' ? 'bg-zinc-950 border border-zinc-900' : 'bg-white border border-zinc-200'}`}><span class={theme === 'dark' ? 'text-zinc-300' : 'text-zinc-700'}>{a.direction} ${a.target.toFixed(2)}</span><button onClick={()=>setPriceAlerts(priceAlerts.filter(x=>x.id!==a.id))} class="text-red-500">REMOVE</button></div>)}
                            </div>
                            <div class="p-6 space-y-4 flex-1 flex flex-col">
                                <div class="flex items-center justify-between">
                                    <h3 class={`text-[10px] font-mono font-bold tracking-widest uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>FINANCIAL STATEMENTS</h3>
                                    <div class={`flex border p-0.5 rounded-sm ${theme === 'dark' ? 'bg-zinc-950 border-zinc-900' : 'bg-zinc-100 border-zinc-200'}`}>
                                        {['annual', 'quarter'].map(mode => (
                                            <button key={mode} onClick={() => setFinancialView(mode)} class={`text-[9px] font-mono font-bold px-2 py-0.5 rounded-xs uppercase cursor-pointer ${financialView === mode ? 'bg-[#00FF66] text-black' : theme === 'dark' ? 'text-zinc-600' : 'text-zinc-500'}`}>{mode.slice(0, 4)}</button>
                                        ))}
                                    </div>
                                </div>

                                <div class="space-y-4 flex-1 justify-around pt-2">
                                    <div>
                                        <div class={`text-[9px] font-mono mb-2 tracking-wider uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>Performance Metrics (REV vs NET)</div>
                                        <div class="space-y-2">
                                            {activeFinancialsData[financialView]?.performance && activeFinancialsData[financialView].performance.length > 0 ? (
                                                activeFinancialsData[financialView].performance.map((item, i) => {
                                                    const maxRev = Math.max(...activeFinancialsData[financialView].performance.map(p => p.revenue || 1));
                                                    return (
                                                        <div key={i} class="font-mono text-[10px] space-y-1">
                                                            <div class={`flex justify-between ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-500'}`}>
                                                                <span>{item.period}</span>
                                                                <span class={`text-[9px] ${theme === 'dark' ? 'text-zinc-500' : 'text-zinc-400'}`}>R: {item.revenue}B / N: {item.netIncome}B</span>
                                                            </div>
                                                            <div class={`w-full h-1.5 rounded-xs overflow-hidden relative ${theme === 'dark' ? 'bg-zinc-900' : 'bg-zinc-200'}`}>
                                                                <div class="bg-blue-600 h-full absolute top-0 left-0" style={{ width: `${(item.revenue/maxRev)*100}%` }}></div>
                                                            </div>
                                                            <div class={`w-full h-1 rounded-xs overflow-hidden relative ${theme === 'dark' ? 'bg-zinc-900' : 'bg-zinc-200'}`}>
                                                                <div class="bg-[#00FF66] h-full absolute top-0 left-0" style={{ width: `${(item.netIncome/maxRev)*100}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <div class={`text-[10px] font-mono italic ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>No historical data segments loaded.</div>
                                            )}
                                        </div>
                                    </div>

                                    <div>
                                        <div class={`text-[9px] font-mono mb-2 tracking-wider uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>EPS Forecast Vectors</div>
                                        <div class="space-y-2">
                                            {activeFinancialsData[financialView]?.earnings.map((item, i) => (
                                                <div key={i} class={`font-mono text-[10px] flex justify-between items-center p-2 rounded-sm ${theme === 'dark' ? 'bg-zinc-950 border border-zinc-900' : 'bg-white border border-zinc-200'}`}>
                                                    <span class={`font-bold ${theme === 'dark' ? 'text-zinc-500' : 'text-zinc-500'}`}>{item.period}</span>
                                                    <span class={theme === 'dark' ? 'text-zinc-400' : 'text-zinc-600'}>ACT: <strong class="text-amber-500">${item.actual}</strong></span>
                                                    <span class={theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}>EST: ${item.forecast}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>

                    </div>
                </div>
            );
        }

        function CandlestickChart({ vectorData, theme, showPatterns }) {
            const [hoverNode, setHoverNode] = React.useState(null);

            if (!vectorData || vectorData.length === 0) {
                return <div class="h-full flex items-center justify-center font-mono text-xs text-zinc-700 animate-pulse">CONNECTING INTERFACE PIPELINES...</div>;
            }

            const highLowPrices = vectorData.map(d => [d.high, d.low]).flat();
            const maxPrice = Math.max(...highLowPrices) * 1.01;
            const minPrice = Math.min(...highLowPrices) * 0.99;
            const priceDelta = maxPrice - minPrice || 1;

            const macdIndicators = vectorData.map(d => [d.macd, d.signal, d.hist]).flat();
            const maxMacd = Math.max(...macdIndicators, 0.02);
            const minMacd = Math.min(...macdIndicators, -0.02);
            const macdDelta = maxMacd - minMacd || 1;

            const widthDimension = 700;
            const heightDimension = 450;
            
            const candleAreaHeight = heightDimension * 0.50;
            const rsiAreaHeight = heightDimension * 0.16;
            const macdAreaHeight = heightDimension * 0.18;

            const rsiTop = candleAreaHeight + 20;
            const macdTop = rsiTop + rsiAreaHeight + 20;
            const horizontalStep = widthDimension / vectorData.length;

            const identifiedPatterns = showPatterns ? scanCandlestickPatterns(vectorData) : [];

            return (
                <div class="w-full h-full flex flex-col justify-between">
                    <div class={`mb-3 p-2 rounded-sm font-mono text-[10px] flex flex-wrap gap-x-4 gap-y-1 ${theme === 'dark' ? 'bg-zinc-950 border border-zinc-900 text-zinc-500' : 'bg-white border border-zinc-200 text-zinc-600'}`}>
                        <span class={`${theme === 'dark' ? 'text-zinc-500' : 'text-zinc-400'} font-bold`}>STREAM LOGS //</span>
                        {hoverNode ? (
                            <>
                                <span>T: <strong class="text-white">{hoverNode.time}</strong></span>
                                <span>O: <strong class="text-zinc-400">${hoverNode.open.toFixed(2)}</strong></span>
                                <span>H: <strong class="text-[#00FF66]">${hoverNode.high.toFixed(2)}</strong></span>
                                <span>L: <strong class="text-red-500">${hoverNode.low.toFixed(2)}</strong></span>
                                <span>C: <strong class="text-blue-400">${hoverNode.close.toFixed(2)}</strong></span>
                                <span>RSI: <strong class="text-purple-400">{hoverNode.rsi}</strong></span>
                                <span>MACD: <strong class="text-blue-500">{hoverNode.macd}</strong></span>
                            </>
                        ) : (
                            <span class="italic text-zinc-600">HOVER INTERACTIVE CROSSHAIR NODE ON CHART CELLS</span>
                        )}
                    </div>

                    <div class="flex-1 relative overflow-hidden">
                        <svg width="100%" height="100%" viewBox={`0 0 ${widthDimension} ${heightDimension}`} preserveAspectRatio="none" class="overflow-visible">
                            
                            <line x1={0} y1={candleAreaHeight} x2={widthDimension} y2={candleAreaHeight} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={rsiTop} x2={widthDimension} y2={rsiTop} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={rsiTop + rsiAreaHeight} x2={widthDimension} y2={rsiTop + rsiAreaHeight} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={macdTop} x2={widthDimension} y2={macdTop} stroke="#1f1f23" strokeWidth="1" />

                            {Array.from({ length: 4 }).map((_, idx) => {
                                const calculatedPrice = minPrice + (priceDelta * (idx / 3));
                                const yPos = candleAreaHeight * (1 - (calculatedPrice - minPrice) / priceDelta);
                                return (
                                    <g key={`p-grid-${idx}`}>
                                        <line x1={0} y1={yPos} x2={widthDimension} y2={yPos} stroke="rgba(255,255,255,0.03)" strokeDasharray="2,4" />
                                        <text x={widthDimension - 5} y={yPos - 4} textAnchor="end" fill="#4b5563" fontSize="8" fontFamily="monospace">
                                            ${calculatedPrice.toFixed(2)}
                                        </text>
                                    </g>
                                );
                            })}

                            {[30, 50, 70].map(val => {
                                const yPos = rsiTop + (rsiAreaHeight * (1 - val / 100));
                                return (
                                    <g key={`rsi-${val}`}>
                                        <line x1={0} y1={yPos} x2={widthDimension} y2={yPos} stroke={val === 50 ? "rgba(255,255,255,0.04)" : "rgba(168,85,247,0.15)"} strokeDasharray={val === 50 ? "2,2" : "4,4"} />
                                        <text x={widthDimension - 5} y={yPos - 2} textAnchor="end" fill="#6b7280" fontSize="7" fontFamily="monospace">RSI {val}</text>
                                    </g>
                                );
                            })}

                            {hoverNode && (() => {
                                const targetIdx = vectorData.indexOf(hoverNode);
                                if (targetIdx !== -1) {
                                    const centerX = targetIdx * horizontalStep + (horizontalStep / 2);
                                    return <line x1={centerX} y1={0} x2={centerX} y2={heightDimension} stroke="rgba(0,255,102,0.15)" strokeWidth="1" strokeDasharray="2,2" />;
                                }
                            })()}

                            {identifiedPatterns.map((pat, idx) => {
                                const pad = 3;
                                const leftX = pat.startIndex * horizontalStep + pad;
                                const rightX = (pat.endIndex + 1) * horizontalStep - pad;
                                const width = rightX - leftX;
                                
                                const segmentData = vectorData.slice(pat.startIndex, pat.endIndex + 1);
                                const segHighs = segmentData.map(d => d.high);
                                const segLows = segmentData.map(d => d.low);
                                
                                const topY = candleAreaHeight * (1 - (Math.max(...segHighs) - minPrice) / priceDelta) - pad;
                                const bottomY = candleAreaHeight * (1 - (Math.min(...segLows) - minPrice) / priceDelta) + pad;
                                const height = bottomY - topY;

                                const highlightColor = pat.type === 'BULLISH' ? '#00FF66' : '#ef4444';

                                return (
                                    <g key={`pat-${idx}`}>
                                        <rect 
                                            x={leftX} y={topY} width={width} height={height} 
                                            fill="transparent" stroke={highlightColor} 
                                            strokeWidth="1.5" strokeDasharray="3,3" rx="2" 
                                        />
                                    </g>
                                );
                            })}

                            {showPatterns && (
                                <g transform={`translate(${widthDimension - 140}, 15)`}>
                                    <rect x="0" y="0" width="130" height="36" fill="#09090b" stroke="#18181b" strokeWidth="1" rx="3" opacity="0.9"/>
                                    <circle cx="12" cy="12" r="4" fill="#00FF66" />
                                    <text x="24" y="15" fill="#a1a1aa" fontSize="8" fontFamily="monospace" fontWeight="bold">BULLISH / REVERSAL</text>
                                    <circle cx="12" cy="24" r="4" fill="#ef4444" />
                                    <text x="24" y="27" fill="#a1a1aa" fontSize="8" fontFamily="monospace" fontWeight="bold">BEARISH / REVERSAL</text>
                                </g>
                            )}

                            {vectorData.map((d, i) => {
                                const x = i * horizontalStep + (horizontalStep / 2);
                                const yOpen = candleAreaHeight * (1 - (d.open - minPrice) / priceDelta);
                                const yClose = candleAreaHeight * (1 - (d.close - minPrice) / priceDelta);
                                const yHigh = candleAreaHeight * (1 - (d.high - minPrice) / priceDelta);
                                const yLow = candleAreaHeight * (1 - (d.low - minPrice) / priceDelta);
                                
                                const isGreen = d.close >= d.open;
                                const baseColor = isGreen ? '#00FF66' : '#ef4444';

                                const yRsi = rsiTop + (rsiAreaHeight * (1 - d.rsi / 100));

                                const yMacd = macdTop + (macdAreaHeight * (1 - (d.macd - minMacd) / macdDelta));
                                const ySignal = macdTop + (macdAreaHeight * (1 - (d.signal - minMacd) / macdDelta));
                                const yZeroMacd = macdTop + (macdAreaHeight * (1 - (0 - minMacd) / macdDelta));
                                const yHist = macdTop + (macdAreaHeight * (1 - (d.hist - minMacd) / macdDelta));

                                return (
                                    <g key={i}>
                                        <line x1={x} y1={yHigh} x2={x} y2={yLow} stroke={baseColor} strokeWidth="1" />
                                        <rect x={x - (horizontalStep * 0.25)} y={Math.min(yOpen, yClose)} width={horizontalStep * 0.5} height={Math.max(Math.abs(yOpen - yClose), 1)} fill={isGreen ? '#00FF66' : 'transparent'} stroke={baseColor} strokeWidth="1" />

                                        <line x1={x} y1={yZeroMacd} x2={x} y2={yHist} stroke={d.hist >= 0 ? '#00FF66' : '#ef4444'} strokeWidth={horizontalStep * 0.3} opacity="0.3" />

                                        {i > 0 && (() => {
                                            const prevX = (i - 1) * horizontalStep + (horizontalStep / 2);
                                            const prevRsi = rsiTop + (rsiAreaHeight * (1 - vectorData[i-1].rsi / 100));
                                            const prevMacd = macdTop + (macdAreaHeight * (1 - (vectorData[i-1].macd - minMacd) / macdDelta));
                                            const prevSignal = macdTop + (macdAreaHeight * (1 - (vectorData[i-1].signal - minMacd) / macdDelta));
                                            return (
                                                <g>
                                                    <line x1={prevX} y1={prevRsi} x2={x} y2={yRsi} stroke="#a855f7" strokeWidth="1" opacity="0.8" />
                                                    <line x1={prevX} y1={prevMacd} x2={x} y2={yMacd} stroke="#3b82f6" strokeWidth="1" />
                                                    <line x1={prevX} y1={prevSignal} x2={x} y2={ySignal} stroke="#eab308" strokeWidth="0.8" strokeDasharray="1,1" />
                                                </g>
                                            );
                                        })()}
                                    </g>
                                );
                            })}

                            {vectorData.map((d, i) => (
                                <rect 
                                    key={`box-${i}`}
                                    x={i * horizontalStep} y={0} width={horizontalStep} height={heightDimension}
                                    fill="transparent" class="cursor-crosshair pointer-events-auto"
                                    onMouseEnter={() => setHoverNode(d)}
                                    onMouseLeave={() => setHoverNode(null)}
                                />
                            ))}
                        </svg>
                    </div>
                </div>
            );
        }

        function PatternLab({data, theme}) {
            const rows = getPatternStatisticsSafe(data);
            const completed = rows.filter(r => r.completed);
            const open = rows.filter(r => !r.completed);
            const avg = items => items.length ? items.reduce((s,r) => s + (r.directionAdjusted || 0),0) / items.length : 0;
            const winRate = items => items.length ? items.filter(r => r.directionAdjusted > 0).length / items.length * 100 : 0;
            const median = items => {
                if (!items.length) return 0;
                const values = items.map(r => r.directionAdjusted || 0).sort((x,y) => x-y);
                const m = Math.floor(values.length / 2);
                return values.length % 2 ? values[m] : (values[m-1] + values[m]) / 2;
            };
            const fmt = v => Number.isFinite(v) ? `${v >= 0 ? '+' : ''}${v.toFixed(2)}%` : '—';
            const fmtRatio = v => Number.isFinite(v) && v > 0 ? `${v.toFixed(2)}x` : '—';
            const fmtBody = v => Number.isFinite(v) ? `${(v * 100).toFixed(0)}%` : '—';
            const grouped = [...new Set(rows.map(r => r.label))].map(label => {
                const items = completed.filter(r => r.label === label);
                const sample = rows.filter(r => r.label === label).length;
                return {label, sample, completed: items.length, win: winRate(items), avg: avg(items), median: median(items)};
            }).sort((x,y) => y.completed - x.completed || x.label.localeCompare(y.label));
            const panelClass = theme === 'dark' ? 'border-zinc-900 bg-zinc-950/70 text-zinc-300' : 'border-zinc-200 bg-white text-zinc-700';
            const mutedClass = theme === 'dark' ? 'text-zinc-500' : 'text-zinc-500';
            const rowClass = theme === 'dark' ? 'border-zinc-900' : 'border-zinc-200';
            const detailRows = [...completed].reverse();
            const testPassed = CANDLE_PATTERN_TEST_RESULTS.filter(t => t.passed).length;

            return (
                <div class={`mx-6 mb-4 p-4 border rounded-sm font-mono ${panelClass}`}>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class={`text-[10px] font-bold tracking-wider ${mutedClass}`}>PATTERN LAB // HISTORICAL EVENT STUDY</div>
                        <div class={`text-[9px] ${mutedClass}`}>Detector tests: <strong class={testPassed === CANDLE_PATTERN_TEST_RESULTS.length ? 'text-[#00FF66]' : 'text-red-500'}>{testPassed}/{CANDLE_PATTERN_TEST_RESULTS.length}</strong></div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-[10px] mb-4">
                        <div class={`border p-2 ${rowClass}`}>SIGNALS <strong>{rows.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>COMPLETED <strong>{completed.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BULLISH <strong class="text-[#00FF66]">{completed.filter(r => r.type === 'BULLISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BEARISH <strong class="text-red-500">{completed.filter(r => r.type === 'BEARISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>5-BAR AVG <strong>{fmt(avg(completed))}</strong></div>
                    </div>

                    <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Pattern results</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[9px] min-w-[620px]">
                            <thead><tr class={`border-b ${rowClass} ${mutedClass}`}>
                                <th class="text-left py-2 pr-3">PATTERN</th><th class="text-right py-2 px-2">N</th>
                                <th class="text-right py-2 px-2">5-BAR WIN</th><th class="text-right py-2 px-2">AVG 5-BAR</th>
                                <th class="text-right py-2 px-2">MEDIAN</th>
                            </tr></thead>
                            <tbody>
                                {grouped.length ? grouped.map(item => (
                                    <tr key={item.label} class={`border-b ${rowClass}`}>
                                        <td class="py-2 pr-3 font-bold">{item.label}</td>
                                        <td class="text-right px-2">{item.completed}{item.sample > item.completed ? ` + ${item.sample-item.completed} open` : ''}</td>
                                        <td class="text-right px-2">{item.completed ? `${item.win.toFixed(1)}%` : '—'}</td>
                                        <td class={`text-right px-2 ${item.avg > 0 ? 'text-[#00FF66]' : item.avg < 0 ? 'text-red-500' : ''}`}>{fmt(item.avg)}</td>
                                        <td class="text-right px-2">{fmt(item.median)}</td>
                                    </tr>
                                )) : <tr><td colSpan="5" class={`py-3 italic ${mutedClass}`}>No candlestick patterns detected in the current dataset.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div class={`mt-5 pt-4 border-t ${rowClass}`}>
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div class={`text-[9px] uppercase tracking-wider ${mutedClass}`}>Individual occurrences</div>
                            <div class={`text-[8px] ${mutedClass}`}>Most recent first · completed 5-candle observations only</div>
                        </div>
                        <div class="overflow-x-auto max-h-72 overflow-y-auto">
                            <table class="w-full text-[9px] min-w-[1100px]">
                                <thead class={theme === 'dark' ? 'bg-zinc-950' : 'bg-white'}>
                                    <tr class={`border-b ${rowClass} ${mutedClass}`}>
                                        <th class="text-left py-2 pr-3 sticky top-0">PATTERN</th>
                                        <th class="text-left py-2 px-2 sticky top-0">TIME</th>
                                        <th class="text-right py-2 px-2 sticky top-0">ENTRY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">TREND</th>
                                        <th class="text-right py-2 px-2 sticky top-0">BODY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">VOL</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+1 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+3 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+5 BAR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {detailRows.length ? detailRows.map((r,i) => {
                                        const one = r.returns?.[1];
                                        const three = r.returns?.[3];
                                        const five = r.returns?.[5];
                                        const adjusted = v => r.type === 'BEARISH' && Number.isFinite(v) ? -v : v;
                                        const returnClass = v => adjusted(v) > 0 ? 'text-[#00FF66]' : adjusted(v) < 0 ? 'text-red-500' : '';
                                        const context = r.context || {};
                                        return (
                                            <tr key={`${r.label}-${r.endIndex}-${i}`} class={`border-b ${rowClass}`}>
                                                <td class="py-2 pr-3 font-bold">
                                                    <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.label}</span>
                                                </td>
                                                <td class="px-2">{r.time}</td>
                                                <td class="text-right px-2">NaN</td>
                                                <td class="text-right px-2">{context.priorTrend || '—'}</td>
                                                <td class="text-right px-2">{fmtBody(context.bodyPct)}</td>
                                                <td class="text-right px-2">{fmtRatio(r.volumeRatio)}</td>
                                                <td class={`text-right px-2 ${returnClass(one)}`}>{fmt(adjusted(one))}</td>
                                                <td class={`text-right px-2 ${returnClass(three)}`}>{fmt(adjusted(three))}</td>
                                                <td class={`text-right px-2 font-bold ${returnClass(five)}`}>{fmt(adjusted(five))}</td>
                                            </tr>
                                        );
                                    }) : <tr><td colSpan="9" class={`py-3 italic ${mutedClass}`}>No completed pattern occurrences in the current dataset.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class={`mt-4 text-[9px] leading-relaxed ${mutedClass}`}>
                        <strong>Method:</strong> reversal patterns require a prior 3-candle trend measured before the signal candle. Hammer/shooting-star geometry uses a maximum 35% body/range, a shadow at least 2× the body and the opposite shadow at most 35% of the body.
                        Engulfing patterns use real-body containment. Marubozu requires at least 90% body/range, shadows ≤5% of range and body ≥0.6× prior ATR. Volume is contextual only: current volume / prior 14-candle average; ≥1.10× is labeled volume support.
                        Forward returns are measured from the pattern close at +1, +3 and +5 candles. These are historical observations, not forecasts.
                    </div>

                    {open.length > 0 && <div class={`mt-3 pt-3 border-t ${rowClass}`}>
                        <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Current / incomplete signals</div>
                        <div class="flex flex-wrap gap-2">
                            {open.map((r,i) => <div key={`${r.label}-${r.endIndex}-${i}`} class={`px-2 py-1 border rounded-sm text-[9px] ${rowClass}`}>
                                <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.type}</span>
                                <span class="mx-1">·</span>{r.label}<span class={`ml-1 ${mutedClass}`}>@ {r.time}</span>
                            </div>)}
                        </div>
                    </div>}
                </div>
            );
        }

        const appRoot = ReactDOM.createRoot(document.getElementById('root'));
        appRoot.render(<Dashboard />);
    </script>
</body>
</html>

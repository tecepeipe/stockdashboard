        // Shared persistent-state helper keeps localStorage-backed Dashboard state consistent.
        const useStoredState = (key, initialValue, options = {}) => {
            const { json = false } = options;
            const [value, setValue] = React.useState(() => {
                try {
                    const saved = Storage.get(key);
                    if (saved === null || saved === undefined) {
                        return typeof initialValue === 'function' ? initialValue() : initialValue;
                    }
                    return json ? JSON.parse(saved) : saved;
                } catch (e) {
                    return typeof initialValue === 'function' ? initialValue() : initialValue;
                }
            });

            React.useEffect(() => {
                if (json) {
                    Storage.setJSON(key, value);
                } else {
                    Storage.set(key, value);
                }
            }, [key, value, json]);

            return [value, setValue];
        };

        // Shared numeric/formatting helpers keep display rules and calculations consistent.
        const formatFixed = (value, decimals = 2, fallback = '—') => {
            const number = Number(value);
            return Number.isFinite(number) ? number.toFixed(decimals) : fallback;
        };

        const formatPrice = (value, fallback = '0.00') => formatFixed(value, 2, fallback);

        const formatPercent = (value, signed = false, fallback = '—') => {
            const number = Number(value);
            if (!Number.isFinite(number)) return fallback;
            return `${signed && number >= 0 ? '+' : ''}${number.toFixed(2)}%`;
        };

        const formatRatio = (value, fallback = '—') => {
            const number = Number(value);
            return Number.isFinite(number) && number > 0 ? `${number.toFixed(2)}x` : fallback;
        };

        const formatVolume = (value) => {
            const number = Number(value);
            if (!Number.isFinite(number)) return '0';
            return number > 1e6 ? `${(number / 1e6).toFixed(1)}M` : number.toLocaleString();
        };

        const calculateRangePercent = (low, high) => {
            const lower = Number(low);
            const upper = Number(high);
            return Number.isFinite(lower) && Number.isFinite(upper) && lower !== 0
                ? ((upper - lower) / lower) * 100
                : NaN;
        };

        const calculateRangeSelection = (data, selection) => {
            if (!Array.isArray(data) || data.length === 0 || !selection) return null;

            const rawStart = Number(selection.start);
            const rawEnd = Number(selection.end);
            if (!Number.isFinite(rawStart) || !Number.isFinite(rawEnd)) return null;

            const startIndex = Math.max(0, Math.min(Math.trunc(rawStart), Math.trunc(rawEnd)));
            const endIndex = Math.min(data.length - 1, Math.max(Math.trunc(rawStart), Math.trunc(rawEnd)));
            const startCandle = data[startIndex];
            const endCandle = data[endIndex];

            if (!startCandle || !endCandle) return null;

            const priceChange = endCandle.close - startCandle.close;
            const percentChange = startCandle.close !== 0
                ? (priceChange / startCandle.close) * 100
                : 0;

            return { startIndex, endIndex, startCandle, endCandle, priceChange, percentChange };
        };

        // Lightweight regression checks for pure helpers. These run at load time and
        // intentionally avoid changing application state or UI behavior.
        const CORE_REGRESSION_TESTS = [
            {
                name: 'formatPrice rounds to two decimals',
                run: () => formatPrice(123.456) === '123.46'
            },
            {
                name: 'formatPercent preserves signed output',
                run: () => formatPercent(-2.345, true) === '-2.35%'
            },
            {
                name: 'formatRatio rejects non-positive values',
                run: () => formatRatio(0) === '—' && formatRatio(2.5) === '2.50x'
            },
            {
                name: 'range selection handles reversed indices',
                run: () => {
                    const data = [{close: 100}, {close: 110}, {close: 120}];
                    const result = calculateRangeSelection(data, {start: 2, end: 0});
                    return result?.startIndex === 0 &&
                        result?.endIndex === 2 &&
                        result?.priceChange === 20 &&
                        result?.percentChange === 20;
                }
            },
            {
                name: 'range selection rejects invalid input',
                run: () => calculateRangeSelection([], {start: 0, end: 1}) === null &&
                    calculateRangeSelection([{close: 100}], {start: 'x', end: 0}) === null
            }
        ];

        const CORE_REGRESSION_TEST_RESULTS = CORE_REGRESSION_TESTS.map(test => {
            try {
                return {...test, passed: Boolean(test.run())};

                return {...test, passed: false, error: error?.message || String(error)};
            }
        });

        const failedCoreRegressionTests = CORE_REGRESSION_TEST_RESULTS.filter(test => !test.passed);

        const calculateEMA = (period, values) => {
            if (!values.length) return [];
            const k = 2 / (period + 1);
            const ema = new Array(values.length).fill(values[0] || 0);
            const seedLength = Math.min(period, values.length);

            ema[seedLength - 1] = average(values.slice(0, seedLength));

            for (let i = seedLength; i < values.length; i++) {
                ema[i] = values[i] * k + ema[i - 1] * (1 - k);
            }

            // Preserve the original warm-up behavior.
            for (let i = seedLength - 2; i >= 0; i--) {
                ema[i] = values[i];
            }

            return ema;
        };

        const calculateRSI = (closes, period = 14) => {
            const rsi = new Array(closes.length).fill(50);
            if (closes.length <= period) return rsi;

            let gains = 0;
            let losses = 0;

            for (let i = 1; i <= period; i++) {
                const change = closes[i] - closes[i - 1];
                if (change > 0) gains += change;
                else losses -= change;
            }

            let averageGain = gains / period;
            let averageLoss = losses / period;
            const currentRSI = () =>
                averageLoss === 0
                    ? (averageGain === 0 ? 50 : 100)
                    : 100 - 100 / (1 + averageGain / averageLoss);

            rsi[period] = currentRSI();

            for (let i = period + 1; i < closes.length; i++) {
                const change = closes[i] - closes[i - 1];
                averageGain = (averageGain * (period - 1) + (change > 0 ? change : 0)) / period;
                averageLoss = (averageLoss * (period - 1) + (change < 0 ? -change : 0)) / period;
                rsi[i] = currentRSI();

        const detectCandlestickPatterns = (data) => {
            if (!Array.isArray(data) || data.length < 4) return [];

            const segments = [];
            const trendLookback = 3;
            const atrLookback = 14;
            const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
            const trueRange = (candle, previous) => {
                if (!candle) return 0;
                return Math.max(
                    Number(candle.high) - Number(candle.low),
                    Math.abs(Number(candle.high) - Number(previous?.close ?? candle.close)),
                    Math.abs(Number(candle.low) - Number(previous?.close ?? candle.close))
                );
            };
            const atrAt = index => {
                const end = Math.max(0, index - 1);
                const start = Math.max(0, end - atrLookback + 1);
                const ranges = [];
                for (let j = start; j <= end; j++) ranges.push(trueRange(data[j], data[j - 1]));
                return average(ranges) || 0.01;
            };

            // IMPORTANT: trend is calculated only from candles BEFORE the pattern candle.
            // This prevents the reversal candle itself from creating the trend it is
            // supposed to reverse.
            const trendAt = index => {
                const end = index - 1;
                const start = end - trendLookback + 1;
                if (start < 0 || end < 0) return 'SIDEWAYS';
                const change = Number(data[end].close) - Number(data[start].close);
                const priorAtr = atrAt(index);
                const threshold = priorAtr * 0.35;
                if (change > threshold) return 'UP';
                if (change < -threshold) return 'DOWN';
                return 'SIDEWAYS';
            };

            const averageVolumeAt = index => {
                const end = index - 1;
                const start = Math.max(0, end - atrLookback + 1);
                return average(data.slice(start, end + 1).map(candle => Number(candle.volume) || 0));
            };

            const addPattern = (startIndex, endIndex, type, label, context) => {
                const volumeAverage = averageVolumeAt(endIndex);
                const currentVolume = Number(data[endIndex]?.volume) || 0;
                const volumeRatio = volumeAverage > 0 && currentVolume > 0 ? currentVolume / volumeAverage : null;
                segments.push({
                    startIndex,
                    endIndex,
                    type,
                    label,
                    confidence: volumeRatio != null && volumeRatio >= 1.1 ? 'VOLUME_SUPPORT' : 'WATCH',
                    context: {
                        priorTrend: context.priorTrend,
                        atr: context.atr,
                        bodyPct: context.bodyPct,
                        upperShadowPct: context.upperShadowPct,
                        lowerShadowPct: context.lowerShadowPct,
                        volumeRatio
                    }
                });
            };

            for (let i = trendLookback; i < data.length; i++) {
                const curr = data[i];
                const prev = data[i - 1];
                const currOpen = Number(curr.open);
                const currClose = Number(curr.close);
                const currHigh = Number(curr.high);
                const currLow = Number(curr.low);
                const prevOpen = Number(prev.open);
                const prevClose = Number(prev.close);

                const currRange = Math.max(currHigh - currLow, 0.000001);

                const bodyPct = currBody / currRange;
                const upperShadowPct = upperWick / currRange;
                const lowerShadowPct = lowerWick / currRange;

                    atr,
                    bodyPct,

                    const high = Number(candle?.high);
                    const low = Number(candle?.low);
                    const range = Math.max(high - low, 0.000001);
                    const realBody = Math.abs(close - open);
                    return {
                        open, close, high, low, range, body: realBody,
                        bodyPct: realBody / range,
                        bullish: close > open,
                        bearish: close < open,
                        upperWick: Math.max(0, high - Math.max(open, close)),
                        lowerWick: Math.max(0, Math.min(open, close) - low)
                    };

                    const raw = Storage.get(getCacheKey(provider, ticker, selectedTimeframe));
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    const config = timeframeConfig[selectedTimeframe] || timeframeConfig['1D'];
                    if (!Array.isArray(parsed.data) || !parsed.timestamp || Date.now() - parsed.timestamp > config.cacheMs) return null;
                    return parsed;
                } catch { return null; }
            };
            const writeTimeframeCache = (provider, ticker, selectedTimeframe, data) => {
                Storage.setJSON(getCacheKey(provider, ticker, selectedTimeframe), {
                    version: CACHE_VERSION, timestamp: Date.now(), provider, ticker, timeframe: selectedTimeframe, data
                });
            };

            // Use UTC consistently because API timestamps are UTC. Keep only complete requested windows.
            const getTimeframeBars = (bars, selectedTimeframe) => {
                if (!Array.isArray(bars) || !bars.length) return [];
                const sorted = [...bars].filter(v => v?.time && !Number.isNaN(new Date(v.time).getTime()))
                    .sort((a, b) => new Date(a.time) - new Date(b.time));
                const dayKey = value => value?.sessionDate || new Date(value).toISOString().slice(0, 10);
                const sessions = [...new Set(sorted.map(v => dayKey(v.time)))];
                if (selectedTimeframe === '1D') {
                    const latest = sessions.at(-1);
                    return sorted.filter(v => dayKey(v.time) === latest);
                }
                if (selectedTimeframe === '1W') {
                    const recentSessions = sessions.slice(-5);
                    return sorted.filter(v => recentSessions.includes(dayKey(v.time)));
                }
                const now = new Date();
                const cutoff = new Date(now);
                if (selectedTimeframe === '1M') cutoff.setUTCMonth(cutoff.getUTCMonth() - 1);
                if (selectedTimeframe === '1Y') cutoff.setUTCFullYear(cutoff.getUTCFullYear() - 1);
                return sorted.filter(v => {
                    const date = new Date(v.time);
                    return date >= cutoff && date <= now;
                });
            };

            // Canonical market-data model shared by demo and live providers.
            // Provider-specific field names are converted once at the boundary; the rest
            // of the dashboard works with symbol/name/exchange/currency/bars.
            const normalizeMarketBars = (bars) => {
                if (!Array.isArray(bars)) return [];
                return bars.map(v => ({
                    time: v?.time ?? v?.timestamp ?? v?.t,
                    sessionDate: v?.sessionDate,
                    open: Number(v?.open ?? v?.o),
                    high: Number(v?.high ?? v?.h),
                    low: Number(v?.low ?? v?.l),
                    close: Number(v?.close ?? v?.c),
                    volume: Number(v?.volume ?? v?.v ?? 0)
                })).filter(v =>
                    v.time &&
                    !Number.isNaN(new Date(v.time).getTime()) &&
                    [v.open, v.high, v.low, v.close].every(Number.isFinite) &&
                    v.high >= Math.max(v.open, v.close) &&
                    v.low <= Math.min(v.open, v.close)
                ).sort((a, b) => new Date(a.time) - new Date(b.time));
            };

            const createMarketData = (symbol, bars, provider) => {
                const meta = TICKER_DICTIONARY.find(item => item.ticker === symbol) || {};
                return {
                    symbol,
                    name: meta.name || symbol,
                    exchange: meta.exchange || 'N/A',
                    currency: 'USD',
                    provider,
                    modelVersion: 'v1',
                    bars: normalizeMarketBars(bars)
                };
            };

            const fetchAlphaVantageJson = async (params) => {
                const query = new URLSearchParams({ ...params, apikey: alphaVantageKey });
                const res = await fetch(`https://www.alphavantage.co/query?${query.toString()}`, { cache: 'no-store' });
                const json = await res.json();
                if (!res.ok || json['Error Message'] || json.Note || json.Information) {
                    throw new Error(json['Error Message'] || json.Note || json.Information || `Alpha Vantage request failed (${res.status})`);
                }
                return json;
            };


            // Alpaca adapter: provider-specific fetching and normalization are isolated here.
            const loadAlpacaMarketData = async ({
                watchlist,
                selectedTimeframeConfig,
                timeframe,
                activeStock,
                alpacaKeyId,
                alpacaSecretKey,
                setRenderedChartData,
                writeTimeframeCache,
                getTimeframeBars,
                calculateTechnicalIndicators
            }) => {
                            for (let ticker of watchlist) {
                                const alpacaTimeframe = selectedTimeframeConfig.alpacaInterval;
                                const alpacaLimit = selectedTimeframeConfig.outputsize;
                                const chartPointLimit = selectedTimeframeConfig.maxCandles;
                                // Fetch enough history to apply the same timeframe filter used by Twelve Data.
                                const rangeDays = selectedTimeframeConfig.lookbackDays;
                                const alpacaEnd = new Date();
                                const alpacaStart = new Date(alpacaEnd.getTime() - rangeDays * 86400000);
                                const startIso = alpacaStart.toISOString();
                                const endIso = alpacaEnd.toISOString();
                                const alpacaUrl = `https://data.alpaca.markets/v2/stocks/${encodeURIComponent(ticker)}/bars?timeframe=${alpacaTimeframe}&start=${encodeURIComponent(startIso)}&end=${encodeURIComponent(endIso)}&limit=${alpacaLimit}&sort=asc&feed=iex&adjustment=all`;
                                const alpacaRes = await fetch(alpacaUrl, {
                                    headers: {
                                        'APCA-API-KEY-ID': alpacaKeyId,
                                        'APCA-API-SECRET-KEY': alpacaSecretKey,
                                        'Accept': 'application/json'
                                    },
                                    cache: 'no-store'
                                });
                                const alpacaJson = await alpacaRes.json();
                                if (!alpacaRes.ok || alpacaJson.code || alpacaJson.error) {
                                    throw new Error(alpacaJson.message || alpacaJson.error || `Alpaca request failed for ${ticker}`);
                                }

                                // Alpaca returns compact OHLCV keys (t/o/h/l/c/v).
                                // Normalize them to the same candle shape used by Twelve Data.
                                const rawBars = Array.isArray(alpacaJson.bars)
                                    ? alpacaJson.bars
                                    : (alpacaJson.bars && Array.isArray(alpacaJson.bars[ticker]) ? alpacaJson.bars[ticker] : []);
                                const normalizedBars = rawBars.map(v => ({
                                    time: v.t ?? v.timestamp ?? v.time,
                                    open: Number(v.o ?? v.open),
                                    high: Number(v.h ?? v.high),
                                    low: Number(v.l ?? v.low),
                                    close: Number(v.c ?? v.close),
                                    volume: Number(v.v ?? v.volume ?? 0)
                                })).filter(v =>
                                    v.time &&
                                    [v.open, v.high, v.low, v.close].every(Number.isFinite) &&
                                    v.high >= Math.max(v.open, v.close) &&
                                    v.low <= Math.min(v.open, v.close)
                                ).sort((a, b) => new Date(a.time) - new Date(b.time));

                                // Apply the canonical timeframe window before rendering and pattern detection.
                                const sessionBars = getTimeframeBars(normalizedBars, timeframe);

                                if (sessionBars.length) {
                                    // Render only the latest readable window. Pattern detection runs
                                    // against exactly the same candles that are visible on the chart.
                                    const visibleBars = sessionBars.slice(-chartPointLimit);
                                    const processedData = calculateTechnicalIndicators(visibleBars);
                                    console.info(`[ALPACA OHLC] ${ticker}: ${processedData.length} visible candles (${alpacaTimeframe})`, {
                                        first: processedData[0],
                                        last: processedData[processedData.length - 1]
                                    });
                                    

                                    // Update the active chart immediately. Do not depend on
                                    // the subsequent localStorage read to refresh the graph.
                                    if (ticker === activeStock) {
                                        setRenderedChartData(processedData);
                                    }

                                    writeTimeframeCache('ALPACA', ticker, timeframe, processedData);
                                } else {
                                    console.warn(`Alpaca returned no OHLC bars for ${ticker}`, alpacaJson);
                                }
                            }

            };

            // Alpha Vantage adapter: provider-specific fetching and normalization are isolated here.
            const loadAlphaVantageMarketData = async ({
                watchlist,
                selectedTimeframeConfig,
                timeframe,
                activeStock,
                fetchAlphaVantageJson,
                setRenderedChartData,
                writeTimeframeCache,
                getTimeframeBars,
                calculateTechnicalIndicators
            }) => {
                            for (let ticker of watchlist) {
                                const chartPointLimit = selectedTimeframeConfig.maxCandles;
                                const isIntraday = timeframe !== '1Y';
                                const interval = timeframe === '1D' ? '5min' : timeframe === '1W' ? '15min' : '30min';
                                const params = isIntraday
                                    ? { function: 'TIME_SERIES_INTRADAY', symbol: ticker, interval, outputsize: 'full', adjusted: 'true', extended_hours: 'false' }
                                    : { function: 'TIME_SERIES_DAILY', symbol: ticker, outputsize: 'full' };

                                const avJson = await fetchAlphaVantageJson(params);
                                const seriesKey = isIntraday ? `Time Series (${interval})` : 'Time Series (Daily)';
                                const series = avJson[seriesKey];
                                if (!series || typeof series !== 'object') {
                                    throw new Error(`Alpha Vantage returned no ${timeframe} time series for ${ticker}`);
                                }

                                const normalizedAlphaVantage = Object.entries(series).map(([timestamp, v]) => ({
                                    time: timestamp,
                                    sessionDate: timestamp.slice(0, 10),
                                    open: Number(v['1. open']),
                                    high: Number(v['2. high']),
                                    low: Number(v['3. low']),
                                    close: Number(v['4. close']),
                                    volume: Number(v['5. volume'] || 0)
                                })).filter(v =>
                                    v.time && [v.open, v.high, v.low, v.close].every(Number.isFinite) &&
                                    v.high >= Math.max(v.open, v.close) &&
                                    v.low <= Math.min(v.open, v.close)
                                ).sort((a, b) => new Date(a.time) - new Date(b.time));

                                const visibleAlphaVantage = getTimeframeBars(normalizedAlphaVantage, timeframe).slice(-chartPointLimit);
                                const processedData = calculateTechnicalIndicators(visibleAlphaVantage);
                                if (processedData.length) {
                                    if (ticker === activeStock) setRenderedChartData(processedData);
                                    writeTimeframeCache('ALPHAVANTAGE', ticker, timeframe, processedData);
                                } else {
                                    console.warn(`Alpha Vantage returned no usable OHLC bars for ${ticker}`);
                                }
                            }
            };

            const loadTwelveDataMarketData = async ({
            watchlist,
            selectedTimeframeConfig,
            selectedInterval,
            timeframe,
            apiKey,
            createMarketData,
            getTimeframeBars,
            calculateTechnicalIndicators,
            writeTimeframeCache
        }) => {
            const symbolsParam = watchlist.join(',');
            const url = `https://api.twelvedata.com/time_series?symbol=${symbolsParam}&interval=${selectedInterval}&outputsize=${selectedTimeframeConfig.outputsize}&apikey=${apiKey}`;
            const res = await fetch(url);
            const resJson = await res.json();
            if (resJson.status === 'error') throw new Error(resJson.message);
            for (let ticker of watchlist) {
                const tickerData = watchlist.length === 1 ? resJson : resJson[ticker];
                if (tickerData && tickerData.values) {
                    const marketData = createMarketData(ticker, tickerData.values.map(v => ({
                        time: v.datetime,
                        open: v.open,
                        high: v.high,
                        low: v.low,
                        close: v.close,
                        volume: v.volume || 0
                    })), 'TWELVEDATA');
                    const visibleTwelveData = getTimeframeBars(marketData.bars, timeframe).slice(-selectedTimeframeConfig.maxCandles);
                    const processedData = calculateTechnicalIndicators(visibleTwelveData);                    const cacheKey = `timeframe-v6_cache_${ticker}_${timeframe}_twelvedata`;
                    writeTimeframeCache('TWELVEDATA', ticker, timeframe, processedData);
                }
            }
        };

        const fetchPipelineData = React.useCallback(async (forceRefresh = false) => {
                setSyncProgress(10);
                setSyncStatusText('SCANNING CHANNELS...');
                
                const selectedTimeframeConfig = timeframeConfig[timeframe] || timeframeConfig['1D'];                const selectedInterval = selectedTimeframeConfig.tdInterval;
                const localPrices = { ...stockPrices };

                let allCached = true;
                if (!forceRefresh) {
                    for (const ticker of watchlist) {
                        const cached = readTimeframeCache(hasLiveCredentials ? activeProvider : 'FAKE', ticker, timeframe);
                        if (!cached) { allCached = false; break; }
                    }
                } else {
                    allCached = false;
                }


                if (!hasLiveCredentials) {
                    for (let ticker of watchlist) {
                        const cacheKey = getCacheKey('FAKE', ticker, timeframe);
                        const marketData = createMarketData(ticker, generateForcedFakeData(ticker, timeframe), 'FAKE');
                        const processedData = marketData.bars;
                        writeTimeframeCache('FAKE', ticker, timeframe, processedData);
                        
                        const currentCandle = processedData[processedData.length - 1];
                        const staticMeta = TICKER_DICTIONARY.find(i => i.ticker === ticker) || { cap: '150B', pe: '22.0' };
                        
                        localPrices[ticker] = {
                            price: currentCandle.close,
                            change: ((currentCandle.close - processedData[0].close) / processedData[0].close) * 100,
                            volume: '1.2M',
                            cap: staticMeta.cap,                            pe: staticMeta.pe
                        };
                        if (ticker === activeStock) setRenderedChartData(processedData);
                    }
                    setStockPrices(localPrices);
                    setSyncProgress(100);
                    setSyncStatusText('SIMULATION MODE BUFFERED');
                    return;
                }

                // Alpaca OHLC bars must be refreshed independently of cached quote snapshots.
                // The quote pane can update while the historical candlestick dataset remains stale.
                const needsActiveQuote = !quoteInfo[activeStock];
                if (!allCached || forceRefresh || needsActiveQuote) {
                    try {
                        setSyncProgress(30);
                        if (activeProvider === 'ALPACA') {
                            await loadAlpacaMarketData({
                                watchlist,
                                selectedTimeframeConfig,
                                timeframe,
                                activeStock,
                                alpacaKeyId,
                                alpacaSecretKey,
                                setRenderedChartData,
                                writeTimeframeCache,
                                getTimeframeBars,
                                calculateTechnicalIndicators
                            });
                        } else if (activeProvider === 'ALPHAVANTAGE') {
                            await loadAlphaVantageMarketData({
                                watchlist,
                                selectedTimeframeConfig,
                                timeframe,
                                activeStock,
                                fetchAlphaVantageJson,
                                setRenderedChartData,
                                writeTimeframeCache,
                                getTimeframeBars,
                                calculateTechnicalIndicators
                            });
                        } else {
                            await loadTwelveDataMarketData({
                                watchlist,
                                selectedTimeframeConfig,
                                selectedInterval,
                                timeframe,
                                apiKey,
                                createMarketData,
                                getTimeframeBars,
                                calculateTechnicalIndicators,
                                writeTimeframeCache
                            });
                        }
                        if (activeProvider === 'TWELVEDATA') {
                            setSyncProgress(60);
                            setSyncStatusText('COMPILING KEY PROFILE VECTORS...');
                        const profileUrl = `https://api.twelvedata.com/profile?symbol=${activeStock}&apikey=${apiKey}`;
                        const profileRes = await fetch(profileUrl);
                        const profileJson = await profileRes.json();

                        if (profileJson && (!profileJson.status || profileJson.status !== 'error')) {
                            const targetProfile = activeStock.includes(',') ? profileJson[activeStock] : profileJson;
                            if (targetProfile && targetProfile.meta) {
                                setFundamentals(prev => ({
                                    ...prev,
                                    [activeStock]: {
                                        market_cap: formatMarketCap(targetProfile.meta.market_cap || targetProfile.meta.market_capitalization),
                                        pe_ratio: targetProfile.meta.pe_ratio ? parseFloat(targetProfile.meta.pe_ratio).toFixed(1) : 'N/A'
                                    }
                                }));
                            }
                        }

                        }

                        // Fetch and cache the selected ticker's live quote for the lower-right information panel.
                        const quoteCacheKey = `quote_${activeProvider.toLowerCase()}_${activeStock}`;
                        const quoteCached = Storage.getJSON(quoteCacheKey);
                        let quoteJson = !forceRefresh && quoteCached && Date.now() - quoteCached.timestamp < 5 * 60 * 1000 ? quoteCached.data : null;
                        if (!quoteJson) {
                            if (activeProvider === 'ALPACA') {
                                const quoteRes = await fetch(`https://data.alpaca.markets/v2/stocks/${encodeURIComponent(activeStock)}/snapshot?feed=iex`, {
                                    headers: {
                                        'APCA-API-KEY-ID': alpacaKeyId,
                                        'APCA-API-SECRET-KEY': alpacaSecretKey
                                    }
                                });
                                const snapshot = await quoteRes.json();
                                if (!quoteRes.ok || snapshot.code) throw new Error(snapshot.message || 'Alpaca snapshot request failed');
                                quoteJson = {
                                    price: snapshot.latestTrade?.p ?? snapshot.minuteBar?.c ?? snapshot.dailyBar?.c,
                                    close: snapshot.latestTrade?.p ?? snapshot.minuteBar?.c ?? snapshot.dailyBar?.c,
                                    percent_change: snapshot.prevDailyBar?.c ? (((snapshot.dailyBar?.c - snapshot.prevDailyBar.c) / snapshot.prevDailyBar.c) * 100) : 0,
                                    volume: snapshot.dailyBar?.v,
                                    low: snapshot.dailyBar?.l,
                                    high: snapshot.dailyBar?.h,
                                    source: 'ALPACA'
                                };
                            } else if (activeProvider === 'ALPHAVANTAGE') {
                                const quoteJsonRaw = await fetchAlphaVantageJson({ function: 'GLOBAL_QUOTE', symbol: activeStock, entitlement: 'realtime' });
                                const quote = quoteJsonRaw['Global Quote'] || {};
                                quoteJson = {
                                    price: Number(quote['05. price'] || 0),
                                    close: Number(quote['05. price'] || quote['08. previous close'] || 0),
                                    percent_change: parseFloat(String(quote['10. change percent'] || '0').replace('%', '')) || 0,
                                    volume: Number(quote['06. volume'] || 0),
                                    low: Number(quote['04. low'] || 0),
                                    high: Number(quote['03. high'] || 0),
                                    open: Number(quote['02. open'] || 0),
                                    previous_close: Number(quote['08. previous close'] || 0),
                                    change: Number(quote['09. change'] || 0),
                                    latest_trading_day: quote['07. latest trading day'],
                                    source: 'ALPHAVANTAGE'
                                };
                            } else {
                                const quoteRes = await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(activeStock)}&apikey=${apiKey}`);
                                quoteJson = await quoteRes.json();
                            }
                            if (!quoteJson.status || quoteJson.status !== 'error') {
                                Storage.setJSON(quoteCacheKey, { timestamp: Date.now(), data: quoteJson });
                            }
                        }
                        if (quoteJson && (!quoteJson.status || quoteJson.status !== 'error')) {
                            setQuoteInfo(prev => ({ ...prev, [activeStock]: quoteJson }));
                            setStockPrices(prev => ({
                                ...prev,
                                [activeStock]: {
                                    ...(prev[activeStock] || {}),
                                    price: Number(quoteJson.close || quoteJson.price || 0),
                                    change: Number(quoteJson.percent_change || 0),
                                    volume: quoteJson.volume || prev[activeStock]?.volume || 'N/A',
                                    cap: prev[activeStock]?.cap || 'N/A',
                                    pe: prev[activeStock]?.pe || 'N/A'
                                }
                            }));
                        }

                        if (activeProvider === 'TWELVEDATA') {
                            // PRODUCTION IMPLEMENTATION: Fetch real income statements (both annual and quarterly profiles)
                            setSyncProgress(80);
                        setSyncStatusText('FETCHING LIVE FUNDAMENTAL STATEMENTS...');
                        
                        // 1. Fetch Annual Income Statement Data
                        const incAnnRes = await fetch(`https://api.twelvedata.com/income_statement?symbol=${activeStock}&period=annual&apikey=${apiKey}`);
                        const incAnnJson = await incAnnRes.json();

                        // 2. Fetch Quarterly Income Statement Data
                        const incQtrRes = await fetch(`https://api.twelvedata.com/income_statement?symbol=${activeStock}&period=quarterly&apikey=${apiKey}`);
                        const incQtrJson = await incQtrRes.json();

                        let structuredLiveFinancials = { annual: { performance: [], earnings: [] }, quarter: { performance: [], earnings: [] } };

                        if (incAnnJson.income_statement) {
                            structuredLiveFinancials.annual.performance = incAnnJson.income_statement.slice(0, 3).map(statement => ({
                                period: statement.fiscal_date ? statement.fiscal_date.split('-')[0] : 'N/A',
                                revenue: parseFloat((parseFloat(statement.revenue || 0) / 1e9).toFixed(2)),
                                netIncome: parseFloat((parseFloat(statement.net_income || 0) / 1e9).toFixed(2))
                            })).reverse(); // Reverse to display chronological timeline order (2023 -> 2025)
                        }

                        if (incQtrJson.income_statement) {
                            structuredLiveFinancials.quarter.performance = incQtrJson.income_statement.slice(0, 3).map(statement => {
                                let label = statement.fiscal_date || 'N/A';
                                if (statement.fiscal_date) {
                                    const dateParts = statement.fiscal_date.split('-');
                                    const month = parseInt(dateParts[1]);
                                    const yearShort = dateParts[0].slice(2);
                                    let qLabel = 'Q1';
                                    if (month > 3 && month <= 6) qLabel = 'Q2';
                                    else if (month > 6 && month <= 9) qLabel = 'Q3';
                                    else if (month > 9 || month <= 3) qLabel = 'Q4';
                                    label = `${qLabel} ${yearShort}`;
                                }
                                return {
                                    period: label,
                                    revenue: parseFloat((parseFloat(statement.revenue || 0) / 1e9).toFixed(2)),
                                    netIncome: parseFloat((parseFloat(statement.net_income || 0) / 1e9).toFixed(2))
                                };
                            }).reverse();
                        }

                        // EPS Fallback vectors if separate earnings endpoints aren't provisioned on the plan tier
                        const simulatedDataRef = generateFinancials(activeStock, null);
                        structuredLiveFinancials.annual.earnings = simulatedDataRef.annual.earnings;
                        structuredLiveFinancials.quarter.earnings = simulatedDataRef.quarter.earnings;

                            setLiveFinancials(prev => ({ ...prev, [activeStock]: structuredLiveFinancials }));
                        } else if (activeProvider === 'ALPHAVANTAGE') {
                            setSyncProgress(75);
                            setSyncStatusText('FETCHING ALPHAVANTAGE FUNDAMENTALS...');

                            const [overviewJson, incomeJson, earningsJson] = await Promise.all([
                                fetchAlphaVantageJson({ function: 'OVERVIEW', symbol: activeStock }),
                                fetchAlphaVantageJson({ function: 'INCOME_STATEMENT', symbol: activeStock }),
                                fetchAlphaVantageJson({ function: 'EARNINGS', symbol: activeStock })
                            ]);

                            if (overviewJson && !overviewJson['Error Message']) {
                                setFundamentals(prev => ({
                                    ...prev,
                                    [activeStock]: {
                                        market_cap: formatMarketCap(overviewJson.MarketCapitalization),
                                        pe_ratio: overviewJson.PERatio && overviewJson.PERatio !== 'None' ? parseFloat(overviewJson.PERatio).toFixed(1) : 'N/A'
                                    }
                                }));
                            }

                            const toBillions = value => {
                                const n = Number(value);
                                return Number.isFinite(n) ? parseFloat((n / 1e9).toFixed(2)) : 0;
                            };
                            const annualReports = Array.isArray(incomeJson.annualReports) ? incomeJson.annualReports : [];
                            const quarterlyReports = Array.isArray(incomeJson.quarterlyReports) ? incomeJson.quarterlyReports : [];
                            const annualEarnings = Array.isArray(earningsJson.annualEarnings) ? earningsJson.annualEarnings : [];
                            const quarterlyEarnings = Array.isArray(earningsJson.quarterlyEarnings) ? earningsJson.quarterlyEarnings : [];

                            const annualPerformance = annualReports.slice(0, 3).map(statement => ({
                                period: statement.fiscalDateEnding ? statement.fiscalDateEnding.slice(0, 4) : 'N/A',
                                revenue: toBillions(statement.totalRevenue),
                                netIncome: toBillions(statement.netIncome)
                            })).reverse();

                            const quarterLabel = date => {
                                if (!date) return 'N/A';
                                const [year, month] = date.split('-');
                                const m = Number(month);
                                const q = m <= 3 ? 'Q1' : m <= 6 ? 'Q2' : m <= 9 ? 'Q3' : 'Q4';
                                return `${q} ${year.slice(2)}`;
                            };

                            const quarterPerformance = quarterlyReports.slice(0, 3).map(statement => ({
                                period: quarterLabel(statement.fiscalDateEnding),
                                revenue: toBillions(statement.totalRevenue),
                                netIncome: toBillions(statement.netIncome)
                            })).reverse();

                            const annualEarningsData = annualEarnings.slice(0, 3).map(item => ({
                                period: item.fiscalDateEnding ? item.fiscalDateEnding.slice(0, 4) : 'N/A',
                                actual: Number(item.reportedEPS),
                                forecast: Number(item.reportedEPS)
                            })).filter(item => Number.isFinite(item.actual)).reverse();

                            const quarterlyEarningsData = quarterlyEarnings.slice(0, 3).map(item => ({
                                period: quarterLabel(item.fiscalDateEnding),
                                actual: Number(item.reportedEPS),
                                forecast: Number(item.estimatedEPS),
                                surprise: Number(item.surprisePercentage)
                            })).filter(item => Number.isFinite(item.actual)).reverse();

                            const simulatedDataRef = generateFinancials(activeStock, null);
                            const structuredAlphaFinancials = {
                                annual: {
                                    performance: annualPerformance.length ? annualPerformance : simulatedDataRef.annual.performance,
                                    earnings: annualEarningsData.length ? annualEarningsData : simulatedDataRef.annual.earnings
                                },
                                quarter: {
                                    performance: quarterPerformance.length ? quarterPerformance : simulatedDataRef.quarter.performance,
                                    earnings: quarterlyEarningsData.length ? quarterlyEarningsData : simulatedDataRef.quarter.earnings
                                }
                            };
                            setLiveFinancials(prev => ({ ...prev, [activeStock]: structuredAlphaFinancials }));
                        }

                    } catch (e) {
                        console.error(`${activeProvider} Stream Exception Encountered:`, e.message);
                        setSyncStatusText(`API ERROR: ${e.message.slice(0, 20)}...`);
                    }
                }

            // Deliberately no automatic refresh: use the manual refresh control to save API requests.

                        return [];

                if (alpacaAssetsCacheRef.current.key !== cacheKey) alpacaAssetsCacheRef.current = { key: cacheKey, assets: {}, loading: {} };
                const cached = alpacaAssetsCacheRef.current.assets?.[symbol];
                if (cached) return cached;
                if (alpacaAssetsCacheRef.current.loading?.[symbol]) return alpacaAssetsCacheRef.current.loading[symbol];

                const request = (async () => {
                    for (const endpoint of ['https://api.alpaca.markets/v2/assets/','https://paper-api.alpaca.markets/v2/assets/']) {
                        try {

                                alpacaAssetsCacheRef.current.assets[asset.ticker] = asset;
                                return asset;
                            }

                    return null;

                        <main class={`lg:col-span-6 flex flex-col overflow-hidden transition-all duration-300 ${isMaximized ? `fixed inset-0 z-50 p-6 ${theme === 'dark' ? 'bg-[#050505]' : 'bg-[#f0f2f5]'}` : `${theme === 'dark' ? 'border-zinc-900 bg-zinc-950/20' : 'border-zinc-200 bg-white'}`}`}>

                            {showFinancials && <div class="p-6 space-y-4 flex-1 flex flex-col">

                                <div class="space-y-4 flex-1 justify-around pt-2">

                                            {activeFinancialsData[financialView]?.performance && activeFinancialsData[financialView].performance.length > 0 ? (

                                    <div>
                                        <div class={`text-[9px] font-mono mb-2 tracking-wider uppercase ${theme === 'dark' ? 'text-zinc-600' : 'text-zinc-400'}`}>EPS Forecast Vectors</div>

                                            {activeFinancialsData[financialView]?.earnings.map((item, i) => (

                                                    <span class={`font-bold ${theme === 'dark' ? 'text-zinc-500' : 'text-zinc-500'}`}>{item.period}</span>
                                                    <span class={theme === 'dark' ? 'text-zinc-400' : 'text-zinc-600'}>ACT: <strong class="text-amber-500">${item.actual}</strong></span>

            let capMultiplier = 150;

        const calculateTechnicalIndicators = (data) => {

            const closes=data.map(d=>Number(d.close)||0), highs=data.map(d=>Number(d.high)||0), lows=data.map(d=>Number(d.low)||0), volumes=data.map(d=>Number(d.volume)||0);

            const calcEMA=(period,values)=>{if(!values.length)return[];const k=2/(period+1),ema=new Array(values.length).fill(values[0]||0),n=Math.min(period,values.length);ema[n-1]=average(values.slice(0,n));for(let i=n;i<values.length;i++)ema[i]=values[i]*k+ema[i-1]*(1-k);for(let i=n-2;i>=0;i--)ema[i]=values[i];return ema;};

        // Deterministic demo market data. The mock series intentionally contains

        const scanCandlestickPatterns = (data) => {
            if (!Array.isArray(data) || data.length < 4) return [];

            const segments = [];
            const trendLookback = 3;
            const atrLookback = 14;
            const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
            const trueRange = (candle, previous) => {
                if (!candle) return 0;
                return Math.max(
                    Number(candle.high) - Number(candle.low),
                    Math.abs(Number(candle.high) - Number(previous?.close ?? candle.close)),
                    Math.abs(Number(candle.low) - Number(previous?.close ?? candle.close))

            };
            const atrAt = index => {
                const end = Math.max(0, index - 1);
                const start = Math.max(0, end - atrLookback + 1);
                const ranges = [];
                for (let j = start; j <= end; j++) ranges.push(trueRange(data[j], data[j - 1]));
                return average(ranges) || 0.01;
            };

            // IMPORTANT: trend is calculated only from candles BEFORE the pattern candle.
            // This prevents the reversal candle itself from creating the trend it is
            // supposed to reverse.
            const trendAt = index => {
                const end = index - 1;
                const start = end - trendLookback + 1;
                if (start < 0 || end < 0) return 'SIDEWAYS';
                const change = Number(data[end].close) - Number(data[start].close);
                const priorAtr = atrAt(index);
                const threshold = priorAtr * 0.35;
                if (change > threshold) return 'UP';
                if (change < -threshold) return 'DOWN';
                return 'SIDEWAYS';
            };

            const averageVolumeAt = index => {
                const end = index - 1;
                const start = Math.max(0, end - atrLookback + 1);
                return average(data.slice(start, end + 1).map(candle => Number(candle.volume) || 0));

            const addPattern = (startIndex, endIndex, type, label, context) => {
                const volumeAverage = averageVolumeAt(endIndex);
                const currentVolume = Number(data[endIndex]?.volume) || 0;
                const volumeRatio = volumeAverage > 0 && currentVolume > 0 ? currentVolume / volumeAverage : null;
                segments.push({
                    startIndex,
                    endIndex,
                    type,
                    label,
                    confidence: volumeRatio != null && volumeRatio >= 1.1 ? 'VOLUME_SUPPORT' : 'WATCH',
                    context: {
                        priorTrend: context.priorTrend,
                        atr: context.atr,
                        bodyPct: context.bodyPct,
                        upperShadowPct: context.upperShadowPct,
                        lowerShadowPct: context.lowerShadowPct,
                        volumeRatio
                    }
                });
            };

            for (let i = trendLookback; i < data.length; i++) {
                const curr = data[i];
                const prev = data[i - 1];
                const currOpen = Number(curr.open);
                const currClose = Number(curr.close);
                const currHigh = Number(curr.high);
                const currLow = Number(curr.low);
                const prevOpen = Number(prev.open);
                const prevClose = Number(prev.close);

                if (![currOpen, currClose, currHigh, currLow, prevOpen, prevClose].every(Number.isFinite)) continue;

                const currBody = Math.abs(currClose - currOpen);
                const currRange = Math.max(currHigh - currLow, 0.000001);
                const prevBody = Math.abs(prevClose - prevOpen);
                const isCurrGreen = currClose > currOpen;
                const isPrevGreen = prevClose > prevOpen;
                const trend = trendAt(i);
                const atr = atrAt(i);

                const lowerWick = Math.max(0, Math.min(currOpen, currClose) - currLow);
                const upperWick = Math.max(0, currHigh - Math.max(currOpen, currClose));
                const bodyPct = currBody / currRange;
                const upperShadowPct = upperWick / currRange;
                const lowerShadowPct = lowerWick / currRange;
                const body = Math.max(currBody, 0.000001);

                const context = {
                    priorTrend: trend,
                    atr,
                    bodyPct,
                    upperShadowPct,
                    lowerShadowPct
                };

                // Hammer: a small real body near the top of the range, with a
                // lower shadow at least twice the body, little upper shadow,
                // and a genuine preceding downtrend.
                if (
                    trend === 'DOWN' &&
                    lowerWick >= body * 2 &&
                    upperWick <= body * 0.35 &&
                    bodyPct <= 0.35
                ) {
                    addPattern(i, i, 'BULLISH', 'HAMMER', context);
                    continue;
                }

                // Shooting star: mirror image of a hammer after a genuine
                // preceding uptrend.
                if (
                    trend === 'UP' &&
                    upperWick >= body * 2 &&
                    lowerWick <= body * 0.35 &&
                    bodyPct <= 0.35
                ) {
                    addPattern(i, i, 'BEARISH', 'SHOOTING STAR', context);
                    continue;
                }

                // Engulfing patterns compare real bodies, not the full candle
                // range. The current body must completely contain the prior body.
                if (prevBody > 0) {
                    const bullishEngulfing =
                        trend === 'DOWN' &&
                        !isPrevGreen &&
                        isCurrGreen &&
                        currOpen <= prevClose &&
                        currClose >= prevOpen &&
                        currBody >= prevBody;

                    const bearishEngulfing =
                        trend === 'UP' &&
                        isPrevGreen &&
                        !isCurrGreen &&
                        currOpen >= prevClose &&
                        currClose <= prevOpen &&
                        currBody >= prevBody;

                    if (bullishEngulfing) {
                        addPattern(i - 1, i, 'BULLISH', 'BULLISH ENGULFING', context);
                        continue;
                    }

                    if (bearishEngulfing) {
                        addPattern(i - 1, i, 'BEARISH', 'BEARISH ENGULFING', context);
                        continue;
                    }
                }

                // Near-Marubozu: very small upper and lower shadows, a large
                // body, and a body that is meaningful relative to prior ATR.
                const minimalBody = currBody >= atr * 0.6;
                if (
                    bodyPct >= 0.90 &&
                    upperShadowPct <= 0.05 &&
                    lowerShadowPct <= 0.05 &&
                    minimalBody
                ) {
                    addPattern(
                        i,
                        i,
                        isCurrGreen ? 'BULLISH' : 'BEARISH',
                        isCurrGreen ? 'BULLISH MARUBOZU' : 'BEARISH MARUBOZU',
                        context
                    );
                }
            }

            return segments;
        };

        // Deterministic regression fixtures for the detector. These are deliberately
        // small synthetic candles with known answers; they protect the recognition
        // rules from accidental regressions while the live/mock market data changes.
        const CANDLE_PATTERN_TESTS = [
            {
                name: 'HAMMER',
                expected: 'HAMMER',
                candles: [
                    {open:110, high:111, low:109.5, close:109.8, volume:1000},
                    {open:108, high:108.5, low:107.5, close:107.8, volume:1000},
                    {open:106, high:106.5, low:105.5, close:105.8, volume:1000},
                    {open:105.6, high:105.63, low:101.0, close:105.5, volume:1300}
                ]
            },
            {
                name: 'SHOOTING STAR',
                expected: 'SHOOTING STAR',
                candles: [
                    {open:100, high:101, low:99, close:100.8, volume:1000},
                    {open:102, high:103, low:101.5, close:102.8, volume:1000},
                    {open:104, high:105, low:103.5, close:104.8, volume:1000},
                    {open:105.0, high:110.0, low:105.0, close:105.2, volume:1300}
                ]
            },
            {
                name: 'BULLISH ENGULFING',
                expected: 'BULLISH ENGULFING',
                candles: [
                    {open:110, high:111, low:108.5, close:109, volume:1000},
                    {open:107, high:108, low:105.5, close:106, volume:1000},
                    {open:104, high:105, low:102.5, close:103, volume:1000},
                    {open:102, high:108, low:101.5, close:107, volume:1300}
                ]
            },
            {
                name: 'BEARISH ENGULFING',
                expected: 'BEARISH ENGULFING',
                candles: [
                    {open:100, high:101.5, low:99, close:101, volume:1000},
                    {open:102, high:103.5, low:101, close:103, volume:1000},
                    {open:104, high:105.5, low:103, close:105, volume:1000},
                    {open:106, high:106.5, low:99.5, close:100, volume:1300}
                ]
            },
            {
                name: 'BULLISH MARUBOZU',
                expected: 'BULLISH MARUBOZU',
                candles: [
                    {open:100, high:101, low:99, close:100.5, volume:1000},
                    {open:100.5, high:101.5, low:100, close:101, volume:1000},
                    {open:101, high:102, low:100.5, close:101.5, volume:1000},
                    {open:100, high:106.02, low:99.98, close:106, volume:1300}
                ]
            },
            {
                name: 'BEARISH MARUBOZU',
                expected: 'BEARISH MARUBOZU',
                candles: [
                    {open:106, high:107, low:105, close:106.5, volume:1000},
                    {open:106.5, high:107.5, low:106, close:107, volume:1000},
                    {open:107, high:108, low:106.5, close:107.5, volume:1000},
                    {open:107, high:107.02, low:100.98, close:101, volume:1300}
                ]
            }
        ];

        const runCandlestickPatternSelfTests = () => CANDLE_PATTERN_TESTS.map(test => {
            const matches = scanCandlestickPatterns(test.candles).some(pattern => pattern.label === test.expected);
            return {...test, passed: matches};
        });

        const CANDLE_PATTERN_TEST_RESULTS = runCandlestickPatternSelfTests();
const getPatternStatistics = data => getPatternStatisticsSafe(data);
        const getPatternStatisticsSafe = data => {
            if (!Array.isArray(data) || !data.length) return [];
            return scanCandlestickPatterns(data).map(p => {
                const entry = Number(data[p.endIndex]?.close) || 0;
                const context = p.context || {};
                const result = {
                    ...p,
                    time: data[p.endIndex]?.time ?? 'N/A',
                    entry,
                    rsi: Number(data[p.endIndex]?.rsi) || 0,
                    macd: Number(data[p.endIndex]?.macd) || 0,
                    volumeRatio: Number.isFinite(context.volumeRatio) ? context.volumeRatio : null,
                    returns: {},
                    completed: false,
                    move: null,
                    directionAdjusted: null
                };
                [1, 3, 5].forEach(horizon => {
                    const futureClose = Number(data[p.endIndex + horizon]?.close);
                    if (entry > 0 && Number.isFinite(futureClose)) {
                        result.returns[horizon] = ((futureClose - entry) / entry) * 100;
                    }
                });
                if (Object.prototype.hasOwnProperty.call(result.returns, 5)) {
                    result.move = result.returns[5];
                    result.directionAdjusted = p.type === 'BEARISH' ? -result.move : result.move;
                    result.completed = true;
                }
                return result;
            });
        };
        function PatternLab({data, theme}) {
            const rows = getPatternStatisticsSafe(data);
            const completed = rows.filter(r => r.completed);
            const open = rows.filter(r => !r.completed);
            const avg = items => items.length ? items.reduce((s,r) => s + (r.directionAdjusted || 0),0) / items.length : 0;
            const winRate = items => items.length ? items.filter(r => r.directionAdjusted > 0).length / items.length * 100 : 0;
            const median = items => {
                if (!items.length) return 0;
                const values = items.map(r => r.directionAdjusted || 0).sort((x,y) => x-y);
                const m = Math.floor(values.length / 2);
                return values.length % 2 ? values[m] : (values[m-1] + values[m]) / 2;
            };
            const fmt = v => Number.isFinite(v) ? `${v >= 0 ? '+' : ''}${v.toFixed(2)}%` : '—';
            const fmtRatio = v => Number.isFinite(v) && v > 0 ? `${v.toFixed(2)}x` : '—';
            const fmtBody = v => Number.isFinite(v) ? `${(v * 100).toFixed(0)}%` : '—';
            const grouped = [...new Set(rows.map(r => r.label))].map(label => {
                const items = completed.filter(r => r.label === label);
                const sample = rows.filter(r => r.label === label).length;
                return {label, sample, completed: items.length, win: winRate(items), avg: avg(items), median: median(items)};
            }).sort((x,y) => y.completed - x.completed || x.label.localeCompare(y.label));
            const panelClass = theme === 'dark' ? 'border-zinc-900 bg-zinc-950/70 text-zinc-300' : 'border-zinc-200 bg-white text-zinc-700';
            const mutedClass = theme === 'dark' ? 'text-zinc-500' : 'text-zinc-500';
            const rowClass = theme === 'dark' ? 'border-zinc-900' : 'border-zinc-200';
            const detailRows = [...completed].reverse();
            const testPassed = CANDLE_PATTERN_TEST_RESULTS.filter(t => t.passed).length;

            return (
                <div class={`mx-6 mb-4 p-4 border rounded-sm font-mono ${panelClass}`}>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class={`text-[10px] font-bold tracking-wider ${mutedClass}`}>PATTERN LAB // HISTORICAL EVENT STUDY</div>
                        <div class={`text-[9px] ${mutedClass}`}>Detector tests: <strong class={testPassed === CANDLE_PATTERN_TEST_RESULTS.length ? 'text-[#00FF66]' : 'text-red-500'}>{testPassed}/{CANDLE_PATTERN_TEST_RESULTS.length}</strong></div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-[10px] mb-4">
                        <div class={`border p-2 ${rowClass}`}>SIGNALS <strong>{rows.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>COMPLETED <strong>{completed.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BULLISH <strong class="text-[#00FF66]">{completed.filter(r => r.type === 'BULLISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BEARISH <strong class="text-red-500">{completed.filter(r => r.type === 'BEARISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>5-BAR AVG <strong>{fmt(avg(completed))}</strong></div>
                    </div>

                    <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Pattern results</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[9px] min-w-[620px]">
                            <thead><tr class={`border-b ${rowClass} ${mutedClass}`}>
                                <th class="text-left py-2 pr-3">PATTERN</th><th class="text-right py-2 px-2">N</th>
                                <th class="text-right py-2 px-2">5-BAR WIN</th><th class="text-right py-2 px-2">AVG 5-BAR</th>
                                <th class="text-right py-2 px-2">MEDIAN</th>
                            </tr></thead>
                            <tbody>
                                {grouped.length ? grouped.map(item => (
                                    <tr key={item.label} class={`border-b ${rowClass}`}>
                                        <td class="py-2 pr-3 font-bold">{item.label}</td>
                                        <td class="text-right px-2">{item.completed}{item.sample > item.completed ? ` + ${item.sample-item.completed} open` : ''}</td>
                                        <td class="text-right px-2">{item.completed ? `${item.win.toFixed(1)}%` : '—'}</td>
                                        <td class={`text-right px-2 ${item.avg > 0 ? 'text-[#00FF66]' : item.avg < 0 ? 'text-red-500' : ''}`}>{fmt(item.avg)}</td>
                                        <td class="text-right px-2">{fmt(item.median)}</td>
                                    </tr>
                                )) : <tr><td colSpan="5" class={`py-3 italic ${mutedClass}`}>No candlestick patterns detected in the current dataset.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div class={`mt-5 pt-4 border-t ${rowClass}`}>
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div class={`text-[9px] uppercase tracking-wider ${mutedClass}`}>Individual occurrences</div>
                            <div class={`text-[8px] ${mutedClass}`}>Most recent first · completed 5-candle observations only</div>
                        </div>
                        <div class="overflow-x-auto max-h-72 overflow-y-auto">
                            <table class="w-full text-[9px] min-w-[1100px]">
                                <thead class={theme === 'dark' ? 'bg-zinc-950' : 'bg-white'}>
                                    <tr class={`border-b ${rowClass} ${mutedClass}`}>
                                        <th class="text-left py-2 pr-3 sticky top-0">PATTERN</th>
                                        <th class="text-left py-2 px-2 sticky top-0">TIME</th>
                                        <th class="text-right py-2 px-2 sticky top-0">ENTRY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">TREND</th>
                                        <th class="text-right py-2 px-2 sticky top-0">BODY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">VOL</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+1 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+3 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+5 BAR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {detailRows.length ? detailRows.map((r,i) => {
                                        const one = r.returns?.[1];
                                        const three = r.returns?.[3];
                                        const five = r.returns?.[5];
                                        const adjusted = v => r.type === 'BEARISH' && Number.isFinite(v) ? -v : v;
                                        const returnClass = v => adjusted(v) > 0 ? 'text-[#00FF66]' : adjusted(v) < 0 ? 'text-red-500' : '';
                                        const context = r.context || {};
                                        return (
                                            <tr key={`${r.label}-${r.endIndex}-${i}`} class={`border-b ${rowClass}`}>
                                                <td class="py-2 pr-3 font-bold">
                                                    <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.label}</span>
                                                </td>
                                                <td class="px-2">{r.time}</td>
                                                <td class="text-right px-2">${Number(r.entry).toFixed(2)}</td>
                                                <td class="text-right px-2">{context.priorTrend || '—'}</td>
                                                <td class="text-right px-2">{fmtBody(context.bodyPct)}</td>
                                                <td class="text-right px-2">{fmtRatio(r.volumeRatio)}</td>
                                                <td class={`text-right px-2 ${returnClass(one)}`}>{fmt(adjusted(one))}</td>
                                                <td class={`text-right px-2 ${returnClass(three)}`}>{fmt(adjusted(three))}</td>
                                                <td class={`text-right px-2 font-bold ${returnClass(five)}`}>{fmt(adjusted(five))}</td>
                                            </tr>
                                        );
                                    }) : <tr><td colSpan="9" class={`py-3 italic ${mutedClass}`}>No completed pattern occurrences in the current dataset.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class={`mt-4 text-[9px] leading-relaxed ${mutedClass}`}>
                        <strong>Method:</strong> reversal patterns require a prior 3-candle trend measured before the signal candle. Hammer/shooting-star geometry uses a maximum 35% body/range, a shadow at least 2× the body and the opposite shadow at most 35% of the body.
                        Engulfing patterns use real-body containment. Marubozu requires at least 90% body/range, shadows ≤5% of range and body ≥0.6× prior ATR. Volume is contextual only: current volume / prior 14-candle average; ≥1.10× is labeled volume support.
                        Forward returns are measured from the pattern close at +1, +3 and +5 candles. These are historical observations, not forecasts.
                    </div>

                    {open.length > 0 && <div class={`mt-3 pt-3 border-t ${rowClass}`}>
                        <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Current / incomplete signals</div>
                        <div class="flex flex-wrap gap-2">
                            {open.map((r,i) => <div key={`${r.label}-${r.endIndex}-${i}`} class={`px-2 py-1 border rounded-sm text-[9px] ${rowClass}`}>
                                <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.type}</span>
                                <span class="mx-1">·</span>{r.label}<span class={`ml-1 ${mutedClass}`}>@ {r.time}</span>
                            </div>)}
                        </div>
                    </div>}
                </div>
            );
        }

        const appRoot = ReactDOM.createRoot(document.getElementById('root'));
        appRoot.render(<Dashboard />);
    </script>
</body>
</html>

                            </div>}
                        </aside>

                    </div>
                </div>
            );
        }

        function CandlestickChart({ vectorData, theme, showPatterns }) {
            const [hoverNode, setHoverNode] = React.useState(null);
            const [rangeSelection, setRangeSelection] = React.useState(null);
            const [isSelectingRange, setIsSelectingRange] = React.useState(false);

            if (!vectorData || vectorData.length === 0) {
                return <div class="h-full flex items-center justify-center font-mono text-xs text-zinc-700 animate-pulse">CONNECTING INTERFACE PIPELINES...</div>;
            }

            // Cached/provider data can occasionally contain incomplete indicator values.
            // Keep the chart SVG strictly finite so one malformed value cannot produce
            // NaN coordinates and flood the browser console with SVG attribute errors.
            const chartData = vectorData
                .filter(d => [d.open, d.high, d.low, d.close].every(Number.isFinite))
                .map(d => ({
                    ...d,
                    rsi: Number.isFinite(d.rsi) ? d.rsi : 50,
                    macd: Number.isFinite(d.macd) ? d.macd : 0,
                    signal: Number.isFinite(d.signal) ? d.signal : 0,
                    hist: Number.isFinite(d.hist) ? d.hist : 0
                }));

            if (chartData.length === 0) {
                return <div class="h-full flex items-center justify-center font-mono text-xs text-zinc-700 animate-pulse">NO VALID MARKET DATA TO RENDER...</div>;
            }

            const buildChartModel = (data) => {
                const highLowPrices = data.map(d => [d.high, d.low]).flat();
                const maxPrice = Math.max(...highLowPrices) * 1.01;
                const minPrice = Math.min(...highLowPrices) * 0.99;
                const priceDelta = maxPrice - minPrice || 1;

                const macdIndicators = data.map(d => [d.macd, d.signal, d.hist]).flat();
                const maxMacd = Math.max(...macdIndicators, 0.02);
                const minMacd = Math.min(...macdIndicators, -0.02);
                const macdDelta = maxMacd - minMacd || 1;

                const width = 700;
                const height = 450;
                const panelGap = 10;
                const candleAreaHeight = height * 0.47;
                const rsiAreaHeight = height * 0.20;
                const macdAreaHeight = height * 0.23;
                const rsiTop = candleAreaHeight + panelGap;
                const macdTop = rsiTop + rsiAreaHeight + panelGap;

                return {
                    width,
                    height,
                    maxPrice,
                    minPrice,
                    priceDelta,
                    maxMacd,
                    minMacd,
                    macdDelta,
                    candleAreaHeight,
                    rsiAreaHeight,
                    macdAreaHeight,
                    rsiTop,
                    macdTop,
                    horizontalStep: width / data.length
                };
            };

            const chartModel = buildChartModel(chartData);
            const {
                width: widthDimension,
                height: heightDimension,
                maxPrice,
                minPrice,
                priceDelta,
                maxMacd,
                minMacd,
                macdDelta,
                candleAreaHeight,
                rsiAreaHeight,
                macdAreaHeight,
                rsiTop,
                macdTop,
                horizontalStep
            } = chartModel;

            const identifiedPatterns = showPatterns ? detectCandlestickPatterns(chartData) : [];

            // Derive simple horizontal support/resistance levels from repeated swing points.
            // Levels are calculated from the same visible candles rendered by this chart.
            const levelTolerance = Math.max(priceDelta * 0.015, 0.01);
            const swingPoints = [];
            for (let i = 2; i < vectorData.length - 2; i++) {
                const d = vectorData[i];
                const isSwingHigh =
                    d.high >= vectorData[i - 1].high &&
                    d.high >= vectorData[i - 2].high &&
                    d.high >= vectorData[i + 1].high &&
                    d.high >= vectorData[i + 2].high;
                const isSwingLow =
                    d.low <= vectorData[i - 1].low &&
                    d.low <= vectorData[i - 2].low &&
                    d.low <= vectorData[i + 1].low &&
                    d.low <= vectorData[i + 2].low;

                if (isSwingHigh) swingPoints.push({ price: d.high, type: 'resistance' });
                if (isSwingLow) swingPoints.push({ price: d.low, type: 'support' });
            }

            const clusterLevels = (points, type) => {
                const clusters = [];
                points.filter(p => p.type === type).forEach(point => {
                    const existing = clusters.find(c => Math.abs(c.price - point.price) <= levelTolerance);
                    if (existing) {
                        existing.prices.push(point.price);
                        existing.price = existing.prices.reduce((a, b) => a + b, 0) / existing.prices.length;
                        existing.touches++;
                    } else {
                        clusters.push({ price: point.price, prices: [point.price], touches: 1, type });
                    }
                });
                return clusters
                    .filter(c => c.touches >= 2)
                    .sort((a, b) => b.touches - a.touches || a.price - b.price)
                    .slice(0, 3);
            };

            const supportLevels = clusterLevels(swingPoints, 'support');
            const resistanceLevels = clusterLevels(swingPoints, 'resistance');

            const chartLabelBg = theme === 'dark' ? '#09090b' : '#ffffff';
            const chartLabelText = theme === 'dark' ? '#a1a1aa' : '#52525b';

            const selectedRange = calculateRangeSelection(chartData, rangeSelection);

            return (
                <div class="w-full h-full flex flex-col justify-between">
                    <div class={`mb-3 p-2 rounded-sm font-mono text-[10px] flex flex-wrap gap-x-4 gap-y-1 ${theme === 'dark' ? 'bg-zinc-950 border border-zinc-900 text-zinc-500' : 'bg-white border border-zinc-200 text-zinc-600'}`}>
                        <span class={`${theme === 'dark' ? 'text-zinc-500' : 'text-zinc-400'} font-bold`}>STREAM LOGS //</span>
                        {hoverNode ? (
                            <>
                                <span>T: <strong class="text-white">{hoverNode.time}</strong></span>
                                <span>O: <strong class="text-zinc-400">${formatPrice(hoverNode.open)}</strong></span>
                                <span>H: <strong class="text-[#00FF66]">${formatPrice(hoverNode.high)}</strong></span>
                                <span>L: <strong class="text-red-500">${formatPrice(hoverNode.low)}</strong></span>
                                <span>C: <strong class="text-blue-400">${formatPrice(hoverNode.close)}</strong></span>
                                <span>RSI: <strong class="text-purple-400">{hoverNode.rsi}</strong></span>
                                <span>MACD: <strong class="text-blue-500">{hoverNode.macd}</strong></span>
                                {selectedRange ? (                                    <span>RANGE: <strong class={selectedRange.percentChange >= 0 ? 'text-[#00FF66]' : 'text-red-500'}>
                                        {selectedRange.percentChange >= 0 ? '+' : ''}{formatFixed(selectedRange.percentChange, 2)}%
                                    </strong> <span class="text-zinc-500">({selectedRange.priceChange >= 0 ? '+' : ''}${formatFixed(selectedRange.priceChange, 2)})</span></span>
                                ) : (
                                    <span>RANGE: <strong class={hoverNode.close >= hoverNode.open ? 'text-[#00FF66]' : 'text-red-500'}>
                                        {formatFixed(calculateRangePercent(hoverNode.low, hoverNode.high), 2)}%
                                    </strong></span>
                                )}
                            </>
                        ) : (
                            <span class="italic text-zinc-600">HOVER INTERACTIVE CROSSHAIR NODE ON CHART CELLS</span>
                        )}
                    </div>
                    <div class="flex-1 relative overflow-hidden">
                        <svg width="100%" height="100%" viewBox={`0 0 ${widthDimension} ${heightDimension}`} preserveAspectRatio="none" class="overflow-visible">
                            
                            <line x1={0} y1={candleAreaHeight} x2={widthDimension} y2={candleAreaHeight} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={rsiTop} x2={widthDimension} y2={rsiTop} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={rsiTop + rsiAreaHeight} x2={widthDimension} y2={rsiTop + rsiAreaHeight} stroke="#1f1f23" strokeWidth="1" />
                            <line x1={0} y1={macdTop} x2={widthDimension} y2={macdTop} stroke="#1f1f23" strokeWidth="1" />

                            <g pointerEvents="none">
                                <rect x="6" y="6" width="142" height="16" rx="2" fill={chartLabelBg} opacity="0.92" />
                                <text x="12" y="17" fill={chartLabelText} fontSize="8" fontFamily="monospace" fontWeight="bold">PRICE ACTION // OHLC</text>
                                <rect x="6" y={rsiTop + 6} width="116" height="16" rx="2" fill={chartLabelBg} opacity="0.92" />
                                <text x="12" y={rsiTop + 17} fill="#c084fc" fontSize="8" fontFamily="monospace" fontWeight="bold">RSI (14) // 30 / 70</text>
                                <rect x="6" y={macdTop + 6} width="142" height="16" rx="2" fill={chartLabelBg} opacity="0.92" />
                                <text x="12" y={macdTop + 17} fill="#60a5fa" fontSize="8" fontFamily="monospace" fontWeight="bold">MACD (12,26,9)</text>
                                <text x="155" y={macdTop + 17} fill="#60a5fa" fontSize="7" fontFamily="monospace">MACD</text>
                                <text x="195" y={macdTop + 17} fill="#eab308" fontSize="7" fontFamily="monospace">SIGNAL</text>
                                <text x="242" y={macdTop + 17} fill="#71717a" fontSize="7" fontFamily="monospace">HIST</text>
                            </g>

                            {(() => {
                                const zeroY = macdTop + (macdAreaHeight * (1 - (0 - minMacd) / macdDelta));
                                return (
                                    <g>                                        <line x1={0} y1={zeroY} x2={widthDimension} y2={zeroY} stroke="rgba(161,161,170,0.32)" strokeWidth="1" strokeDasharray="4,3" />
                                        <text x={widthDimension - 5} y={zeroY - 3} textAnchor="end" fill="#6b7280" fontSize="7" fontFamily="monospace">0</text>
                                    </g>
                                );
                            })()}

                            {[...supportLevels, ...resistanceLevels].map((level, idx) => {
                                const yPos = candleAreaHeight * (1 - (level.price - minPrice) / priceDelta);
                                const isResistance = level.type === 'resistance';
                                const lineColor = isResistance ? '#ef4444' : '#00FF66';
                                return (
                                    <g key={`sr-${level.type}-${idx}`}>
                                        <line
                                            x1={0}
                                            y1={yPos}
                                            x2={widthDimension}
                                            y2={yPos}
                                            stroke={lineColor}
                                            strokeOpacity="0.42"
                                            strokeWidth="1.2"
                                            strokeDasharray="6,4"
                                        />
                                        <rect
                                            x={widthDimension - 68}
                                            y={yPos - 9}
                                            width="63"
                                            height="12"
                                            rx="2"
                                            fill={chartLabelBg}
                                            opacity="0.92"
                                        />
                                        <text
                                            x={widthDimension - 8}
                                            y={yPos}
                                            textAnchor="end"
                                            fill={lineColor}
                                            fontSize="7"
                                            fontFamily="monospace"
                                            fontWeight="bold"
                                        >
                                            {isResistance ? 'R' : 'S'} ${formatPrice(level.price)}
                                        </text>
                                    </g>
                                );
                            })}

                            {[30, 50, 70].map(val => {
                                const yPos = rsiTop + (rsiAreaHeight * (1 - val / 100));
                                return (
                                    <g key={`rsi-${val}`}>
                                        <line x1={0} y1={yPos} x2={widthDimension} y2={yPos} stroke={val === 50 ? "rgba(255,255,255,0.04)" : "rgba(168,85,247,0.15)"} strokeWidth={val === 50 ? "1" : "1.2"} strokeDasharray={val === 50 ? "2,2" : "4,4"} />
                                        <text x={widthDimension - 5} y={yPos - 2} textAnchor="end" fill="#6b7280" fontSize="7" fontFamily="monospace">RSI {val}</text>
                                    </g>
                                );
                            })}

                            {selectedRange && (() => {
                                const leftX = selectedRange.startIndex * horizontalStep;
                                const rightX = (selectedRange.endIndex + 1) * horizontalStep;
                                const startCenterX = selectedRange.startIndex * horizontalStep + (horizontalStep / 2);
                                const endCenterX = selectedRange.endIndex * horizontalStep + (horizontalStep / 2);
                                return (
                                    <g pointerEvents="none">
                                        <rect x={leftX} y={0} width={Math.max(rightX - leftX, horizontalStep)} height={heightDimension} fill="rgba(59,130,246,0.08)" />
                                        <line x1={startCenterX} y1={0} x2={startCenterX} y2={heightDimension} stroke="rgba(59,130,246,0.75)" strokeWidth="1" strokeDasharray="4,3" />
                                        <line x1={endCenterX} y1={0} x2={endCenterX} y2={heightDimension} stroke="rgba(59,130,246,0.75)" strokeWidth="1" strokeDasharray="4,3" />
                                    </g>
                                );
                            })()}

                            {hoverNode && !isSelectingRange && (() => {
                                const targetIdx = chartData.indexOf(hoverNode);
                                if (targetIdx !== -1) {
                                    const centerX = targetIdx * horizontalStep + (horizontalStep / 2);
                                    return <line x1={centerX} y1={0} x2={centerX} y2={heightDimension} stroke="rgba(0,255,102,0.15)" strokeWidth="1" strokeDasharray="2,2" />;
                                }
                            })()}

                            {identifiedPatterns.map((pat, idx) => {
                                const pad = 3;
                                const leftX = pat.startIndex * horizontalStep + pad;
                                const rightX = (pat.endIndex + 1) * horizontalStep - pad;
                                const width = rightX - leftX;
                                
                                const segmentData = chartData.slice(pat.startIndex, pat.endIndex + 1);
                                const segHighs = segmentData.map(d => d.high);
                                const segLows = segmentData.map(d => d.low);
                                
                                const topY = candleAreaHeight * (1 - (Math.max(...segHighs) - minPrice) / priceDelta) - pad;
                                const bottomY = candleAreaHeight * (1 - (Math.min(...segLows) - minPrice) / priceDelta) + pad;
                                const height = bottomY - topY;

                                const highlightColor = pat.type === 'BULLISH' ? '#00FF66' : '#ef4444';

                                return (
                                    <g key={`pat-${idx}`}>
                                        <rect 
                                            x={leftX} y={topY} width={width} height={height} 
                                            fill="transparent" stroke={highlightColor} 
                                            strokeWidth="1.5" strokeDasharray="3,3" rx="2" 
                                        />
                                    </g>
                                );
                            })}

                            {showPatterns && (
                                <g transform={`translate(${widthDimension - 140}, 15)`}>
                                    <rect x="0" y="0" width="130" height="36" fill="#09090b" stroke="#18181b" strokeWidth="1" rx="3" opacity="0.9"/>
                                    <circle cx="12" cy="12" r="4" fill="#00FF66" />
                                    <text x="24" y="15" fill="#a1a1aa" fontSize="8" fontFamily="monospace" fontWeight="bold">BULLISH REVERSAL</text>
                                    <circle cx="12" cy="24" r="4" fill="#ef4444" />
                                    <text x="24" y="27" fill="#a1a1aa" fontSize="8" fontFamily="monospace" fontWeight="bold">BEARISH REVERSAL</text>
                                </g>
                            )}

                            {chartData.map((d, i) => {
                                const x = i * horizontalStep + (horizontalStep / 2);
                                const yOpen = candleAreaHeight * (1 - (d.open - minPrice) / priceDelta);
                                const yClose = candleAreaHeight * (1 - (d.close - minPrice) / priceDelta);
                                const yHigh = candleAreaHeight * (1 - (d.high - minPrice) / priceDelta);
                                const yLow = candleAreaHeight * (1 - (d.low - minPrice) / priceDelta);
                                
                                const isGreen = d.close >= d.open;
                                const baseColor = isGreen ? '#00FF66' : '#ef4444';

                                const yRsi = rsiTop + (rsiAreaHeight * (1 - d.rsi / 100));

                                const yMacd = macdTop + (macdAreaHeight * (1 - (d.macd - minMacd) / macdDelta));
                                const ySignal = macdTop + (macdAreaHeight * (1 - (d.signal - minMacd) / macdDelta));
                                const yZeroMacd = macdTop + (macdAreaHeight * (1 - (0 - minMacd) / macdDelta));
                                const yHist = macdTop + (macdAreaHeight * (1 - (d.hist - minMacd) / macdDelta));

                                return (
                                    <g key={i}>
                                        <line x1={x} y1={yHigh} x2={x} y2={yLow} stroke={baseColor} strokeWidth="1" />
                                        <rect x={x - (horizontalStep * 0.25)} y={Math.min(yOpen, yClose)} width={horizontalStep * 0.5} height={Math.max(Math.abs(yOpen - yClose), 1)} fill={isGreen ? '#00FF66' : 'transparent'} stroke={baseColor} strokeWidth="1" />

                                        <line x1={x} y1={yZeroMacd} x2={x} y2={yHist} stroke={d.hist >= 0 ? '#00FF66' : '#ef4444'} strokeWidth={horizontalStep * 0.3} opacity="0.3" />

                                        {i > 0 && (() => {
                                            const prevX = (i - 1) * horizontalStep + (horizontalStep / 2);
                                            const prevRsi = rsiTop + (rsiAreaHeight * (1 - chartData[i-1].rsi / 100));
                                            const prevMacd = macdTop + (macdAreaHeight * (1 - (chartData[i-1].macd - minMacd) / macdDelta));
                                            const prevSignal = macdTop + (macdAreaHeight * (1 - (chartData[i-1].signal - minMacd) / macdDelta));
                                            return (
                                                <g>
                                                    <line x1={prevX} y1={prevRsi} x2={x} y2={yRsi} stroke="#a855f7" strokeWidth="1" opacity="0.8" />
                                                    <line x1={prevX} y1={prevMacd} x2={x} y2={yMacd} stroke="#3b82f6" strokeWidth="1" />
                                                    <line x1={prevX} y1={prevSignal} x2={x} y2={ySignal} stroke="#eab308" strokeWidth="0.8" strokeDasharray="1,1" />
                                                </g>
                                            );
                                        })()}
                                    </g>
                                );
                            })}

                            {vectorData.map((d, i) => (
                                <rect 
                                    key={`box-${i}`}
                                    x={i * horizontalStep} y={0} width={horizontalStep} height={heightDimension}
                                    fill="transparent" class="cursor-crosshair pointer-events-auto"
                                    onMouseEnter={() => {
                                        setHoverNode(d);
                                        if (isSelectingRange) {
                                            setRangeSelection(prev => prev ? { ...prev, end: i } : { start: i, end: i });
                                        }
                                    }}
                                    onMouseLeave={() => setHoverNode(null)}
                                    onMouseDown={(event) => {
                                        event.preventDefault();
                                        setIsSelectingRange(true);
                                        setRangeSelection({ start: i, end: i });
                                    }}
                                    onMouseUp={() => setIsSelectingRange(false)}
                                />
                            ))}
                        </svg>
                    </div>
                </div>
            );
        }

        function PatternLab({data, theme}) {
            const rows = getPatternStatisticsSafe(data);
            const completed = rows.filter(r => r.completed);
            const open = rows.filter(r => !r.completed);
            const avg = items => items.length ? items.reduce((s,r) => s + (r.directionAdjusted || 0),0) / items.length : 0;
            const winRate = items => items.length ? items.filter(r => r.directionAdjusted > 0).length / items.length * 100 : 0;
            const median = items => {
                if (!items.length) return 0;
                const values = items.map(r => r.directionAdjusted || 0).sort((x,y) => x-y);
                const m = Math.floor(values.length / 2);
                return values.length % 2 ? values[m] : (values[m-1] + values[m]) / 2;
            };
            const fmt = v => formatPercent(v, true);
            const fmtRatio = v => formatRatio(v);
            const fmtBody = v => Number.isFinite(v) ? `${(v * 100).toFixed(0)}%` : '—';
            const grouped = [...new Set(rows.map(r => r.label))].map(label => {
                const items = completed.filter(r => r.label === label);
                const sample = rows.filter(r => r.label === label).length;
                return {label, sample, completed: items.length, win: winRate(items), avg: avg(items), median: median(items)};
            }).sort((x,y) => y.completed - x.completed || x.label.localeCompare(y.label));
            const panelClass = theme === 'dark' ? 'border-zinc-900 bg-zinc-950/70 text-zinc-300' : 'border-zinc-200 bg-white text-zinc-700';
            const mutedClass = theme === 'dark' ? 'text-zinc-500' : 'text-zinc-500';
            const rowClass = theme === 'dark' ? 'border-zinc-900' : 'border-zinc-200';
            const detailRows = [...completed].reverse();
            const testPassed = CANDLE_PATTERN_TEST_RESULTS.filter(t => t.passed).length;

            return (
                <div class={`mx-6 mb-4 p-4 border rounded-sm font-mono ${panelClass}`}>
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class={`text-[10px] font-bold tracking-wider ${mutedClass}`}>PATTERN LAB // HISTORICAL EVENT STUDY</div>
                        <div class={`text-[9px] ${mutedClass}`}>Detector tests: <strong class={testPassed === CANDLE_PATTERN_TEST_RESULTS.length ? 'text-[#00FF66]' : 'text-red-500'}>{testPassed}/{CANDLE_PATTERN_TEST_RESULTS.length}</strong></div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-[10px] mb-4">
                        <div class={`border p-2 ${rowClass}`}>SIGNALS <strong>{rows.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>COMPLETED <strong>{completed.length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BULLISH <strong class="text-[#00FF66]">{completed.filter(r => r.type === 'BULLISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>BEARISH <strong class="text-red-500">{completed.filter(r => r.type === 'BEARISH').length}</strong></div>
                        <div class={`border p-2 ${rowClass}`}>5-BAR AVG <strong>{fmt(avg(completed))}</strong></div>
                    </div>

                    <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Pattern results</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-[9px] min-w-[620px]">
                            <thead><tr class={`border-b ${rowClass} ${mutedClass}`}>
                                <th class="text-left py-2 pr-3">PATTERN</th><th class="text-right py-2 px-2">N</th>
                                <th class="text-right py-2 px-2">5-BAR WIN</th><th class="text-right py-2 px-2">AVG 5-BAR</th>
                                <th class="text-right py-2 px-2">MEDIAN</th>
                            </tr></thead>
                            <tbody>
                                {grouped.length ? grouped.map(item => (
                                    <tr key={item.label} class={`border-b ${rowClass}`}>
                                        <td class="py-2 pr-3 font-bold">{item.label}</td>
                                        <td class="text-right px-2">{item.completed}{item.sample > item.completed ? ` + ${item.sample-item.completed} open` : ''}</td>
                                        <td class="text-right px-2">{item.completed ? `${item.win.toFixed(1)}%` : '—'}</td>
                                        <td class={`text-right px-2 ${item.avg > 0 ? 'text-[#00FF66]' : item.avg < 0 ? 'text-red-500' : ''}`}>{fmt(item.avg)}</td>
                                        <td class="text-right px-2">{fmt(item.median)}</td>
                                    </tr>
                                )) : <tr><td colSpan="5" class={`py-3 italic ${mutedClass}`}>No candlestick patterns detected in the current dataset.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div class={`mt-5 pt-4 border-t ${rowClass}`}>
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <div class={`text-[9px] uppercase tracking-wider ${mutedClass}`}>Individual occurrences</div>
                            <div class={`text-[8px] ${mutedClass}`}>Most recent first · completed 5-candle observations only</div>
                        </div>
                        <div class="overflow-x-auto max-h-72 overflow-y-auto">
                            <table class="w-full text-[9px] min-w-[1100px]">
                                <thead class={theme === 'dark' ? 'bg-zinc-950' : 'bg-white'}>
                                    <tr class={`border-b ${rowClass} ${mutedClass}`}>
                                        <th class="text-left py-2 pr-3 sticky top-0">PATTERN</th>
                                        <th class="text-left py-2 px-2 sticky top-0">TIME</th>
                                        <th class="text-right py-2 px-2 sticky top-0">ENTRY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">TREND</th>
                                        <th class="text-right py-2 px-2 sticky top-0">BODY</th>
                                        <th class="text-right py-2 px-2 sticky top-0">VOL</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+1 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+3 BAR</th>
                                        <th class="text-right py-2 px-2 sticky top-0">+5 BAR</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {detailRows.length ? detailRows.map((r,i) => {
                                        const one = r.returns?.[1];
                                        const three = r.returns?.[3];
                                        const five = r.returns?.[5];
                                        const adjusted = v => r.type === 'BEARISH' && Number.isFinite(v) ? -v : v;
                                        const returnClass = v => adjusted(v) > 0 ? 'text-[#00FF66]' : adjusted(v) < 0 ? 'text-red-500' : '';
                                        const context = r.context || {};
                                        return (
                                            <tr key={`${r.label}-${r.endIndex}-${i}`} class={`border-b ${rowClass}`}>
                                                <td class="py-2 pr-3 font-bold">
                                                    <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.label}</span>
                                                </td>
                                                <td class="px-2">{r.time}</td>
                                                <td class="text-right px-2">${formatPrice(r.entry)}</td>
                                                <td class="text-right px-2">{context.priorTrend || '—'}</td>
                                                <td class="text-right px-2">{fmtBody(context.bodyPct)}</td>
                                                <td class="text-right px-2">{fmtRatio(r.volumeRatio)}</td>
                                                <td class={`text-right px-2 ${returnClass(one)}`}>{fmt(adjusted(one))}</td>
                                                <td class={`text-right px-2 ${returnClass(three)}`}>{fmt(adjusted(three))}</td>
                                                <td class={`text-right px-2 font-bold ${returnClass(five)}`}>{fmt(adjusted(five))}</td>
                                            </tr>
                                        );
                                    }) : <tr><td colSpan="9" class={`py-3 italic ${mutedClass}`}>No completed pattern occurrences in the current dataset.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class={`mt-4 text-[9px] leading-relaxed ${mutedClass}`}>
                        <strong>Method:</strong> reversal patterns require a prior 3-candle trend measured before the signal candle. Hammer/shooting-star geometry uses a maximum 35% body/range, a shadow at least 2× the body and the opposite shadow at most 35% of the body.
                        Engulfing patterns use real-body containment. Marubozu requires at least 90% body/range, shadows ≤5% of range and body ≥0.6× prior ATR. Multi-candle patterns use prior-trend confirmation, normalized candle geometry and relative highs/lows. Volume is contextual only: current volume / prior 14-candle average; ≥1.10× is labeled volume support.
                        Forward returns are measured from the pattern close at +1, +3 and +5 candles. These are historical observations, not forecasts.
                    </div>

                    {open.length > 0 && <div class={`mt-3 pt-3 border-t ${rowClass}`}>
                        <div class={`text-[9px] uppercase tracking-wider mb-2 ${mutedClass}`}>Current / incomplete signals</div>
                        <div class="flex flex-wrap gap-2">
                            {open.map((r,i) => <div key={`${r.label}-${r.endIndex}-${i}`} class={`px-2 py-1 border rounded-sm text-[9px] ${rowClass}`}>
                                <span class={r.type === 'BULLISH' ? 'text-[#00FF66]' : 'text-red-500'}>{r.type}</span>
                                <span class="mx-1">·</span>{r.label}<span class={`ml-1 ${mutedClass}`}>@ {r.time}</span>
                            </div>)}
                        </div>
                    </div>}
                </div>
            );
        }

        const appRoot = ReactDOM.createRoot(document.getElementById('root'));
        appRoot.render(<Dashboard />);
    </script>
</body>
</html>
